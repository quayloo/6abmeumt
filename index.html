{id:'cd3',n:3,title:'Hành vi của người tiêu dùng',sub:'Lợi ích cận biên, đánh đổi trong tiêu dùng, lựa chọn tối ưu',status:'now',src:'Ghi âm buổi 12/11 (chưa có slide)',
 intro:'CĐ2 nhìn người mua như một đường cầu. CĐ3 "mở hộp" đường cầu ra: vì sao người mua chọn mua bao nhiêu, và doanh nghiệp tận dụng hiểu biết đó để định giá, thiết kế sản phẩm thế nào. Đây là lý thuyết cốt lõi cho bài nhóm 3.',
 topics:[
 {t:'Tổng lợi ích và lợi ích cận biên',
  b:`<p>Giả định nối từ phần trước: người tiêu dùng <b>thích nhiều hơn ít</b> — khi chưa tới điểm bão hòa, tiêu dùng tăng thì tổng lợi ích tăng.</p>
<p><b>Lợi ích cận biên (MU — marginal utility):</b> lợi ích tăng thêm khi tiêu dùng thêm một đơn vị hàng hóa hay dịch vụ, với lượng tiêu dùng các hàng hóa khác giữ nguyên. Nó phản ánh thay đổi của tổng lợi ích khi tiêu dùng thêm một đơn vị.</p>
<p>Ví dụ của cô: khách vừa uống một cốc trà sữa; nếu uống thêm cốc thứ hai thì lợi ích cận biên của cốc thứ hai là phần hài lòng tăng thêm do cốc thứ hai mang lại.</p>
<p><b>Phân biệt:</b> TU phản ánh <b>tổng lợi ích</b> nhận được; MU phản ánh <b>lợi ích bổ sung</b> của một đơn vị. Cô nhấn mạnh sự phân biệt này rất quan trọng, vì khi doanh nghiệp nghiên cứu khả năng khách mua thêm, không chỉ dựa vào tổng lợi ích mà phải dựa vào lợi ích cận biên: người tiêu dùng so sánh <b>lợi ích thu thêm với số tiền phải bỏ ra</b> để quyết định.</p>
${svgMU}
<p><b>Cách tính MU:</b> số cốc tăng theo bước 1, nên MU = TU của mức sau − TU của mức trước. Từ 0 lên 1 cốc: TU 0 → 10, MU cốc 1 = 10. Từ 1 lên 2: 10 → 18, MU cốc 2 = 8. Cốc 3: MU = 6. Cốc 6: TU vẫn 30, MU = 0. Cốc 7: TU 30 → 28, MU = −2.</p>
<p><b>Quan hệ TU – MU:</b> MU dương → TU tiếp tục tăng; MU = 0 → TU không tăng (đạt lớn nhất, ở cốc 5–6); MU âm → TU giảm. <b>Điểm bão hòa</b>: tăng tiêu dùng mà không tăng tổng lợi ích.</p>
<p class="small muted">TU cốc 3–4 và MU cốc 5 suy ra từ các số cô đọc trong bản ghi.</p>`,
  m:`<div class="mh">Hiểu đơn giản</div><p>TU là <b>tổng điểm hài lòng</b>, MU là <b>điểm cộng thêm của đơn vị vừa dùng</b>. Giống như tổng điểm của cả bài thi và điểm của từng câu: tổng điểm còn tăng chừng nào câu tiếp theo còn được điểm dương.</p>
<div class="mh">Đơn vị "lợi ích" là gì?</div><p>"Đơn vị lợi ích" (util) là con số giả định để minh họa, không đo được trực tiếp. Trong thực tế, doanh nghiệp đo gián tiếp qua <b>số tiền khách sẵn lòng trả</b> (WTP). Cô cũng dùng cách này trong tình huống cà phê: 10 đơn vị lợi ích ≈ 80.000đ, 8 đơn vị ≈ 60.000đ.</p>
<div class="mh">Liên hệ CĐ1</div><p>Quyết định "mua thêm một đơn vị khi MU (quy ra tiền) lớn hơn giá" chính là Nguyên lý 3 (MB &gt; MC), chỉ khác là áp dụng cho người mua: MB là MU quy ra tiền, MC là giá phải trả.</p>
<div class="mh">Bài tập tự luyện</div><p>TU của 4 cốc là 12, 20, 25, 25. MU lần lượt: 12 − 0 = 12; 20 − 12 = 8; 25 − 20 = 5; 25 − 25 = 0 → cốc 4 là điểm bão hòa.</p>`},
 {t:'Quy luật lợi ích cận biên giảm dần',
  b:`<p>Từ bảng số liệu, cô rút ra <b>quy luật lợi ích cận biên giảm dần</b>: trong những điều kiện nhất định, khi người tiêu dùng tiêu dùng ngày càng nhiều một loại hàng hóa, lợi ích tăng thêm từ mỗi đơn vị sẽ giảm dần, với giả định các yếu tố khác không đổi.</p>
<p>Trong ví dụ: cốc thứ nhất mang lại 10 đơn vị lợi ích, cốc thứ hai chỉ 8, cốc thứ ba 6, cốc thứ tư 4. <b>Điều này không có nghĩa người tiêu dùng không còn thích trà sữa</b> — họ vẫn hài lòng khi uống thêm, chỉ là mức hài lòng không còn lớn như trước.</p>
<p><b>Phạm vi áp dụng:</b> lợi ích cận biên giảm khi lượng tiêu dùng tăng <b>trong điều kiện xác định</b>, thường là cùng một thời điểm, một giai đoạn ngắn. Việc khách giảm hứng thú với sản phẩm sau nhiều năm sử dụng có thể không phải do quy luật này, mà do họ thay đổi sở thích, bối cảnh, thu nhập.</p>
<p><b>Hàm ý cô đưa ra:</b> khách hàng có thể sẵn sàng chi trả ít hơn cho phần tiêu dùng bổ sung, <b>ngay cả khi họ vẫn thích sản phẩm</b>. Vì số tiền sẵn sàng chi trả đo lường lợi ích nhận được, nên lợi ích giảm dần thì sẵn sàng chi trả cũng giảm dần. Doanh nghiệp không được mặc nhiên cho rằng khách đã mua và yêu thích sản phẩm thì sẽ sẵn sàng mua thêm với cùng mức giá.</p>
<p>Ví dụ đời thường cô đưa ra: cốc bia số 1, số 2 thường ngon hơn những cốc tiếp theo; đến cốc thứ 6, 7 thấy đắng và khó chịu hơn. Món ăn ngon được nấu liên tục: bữa đầu tuyệt vời, bữa thứ ba bắt đầu không hứng thú lắm — vẫn ăn được, vẫn tăng lợi ích, nhưng sự hào hứng không còn nhiều.</p>`,
  m:`<div class="mh">Hiểu đơn giản</div><p>Cái đầu tiên luôn "đáng giá" nhất vì nó đáp ứng nhu cầu cấp thiết nhất. Cốc nước đầu tiên khi khát cứu cơn khát; cốc thứ năm chỉ còn là uống cho vui. Mỗi đơn vị sau phục vụ một nhu cầu ít cấp thiết hơn.</p>
<div class="mh">Ví dụ thêm</div><p>Chiếc điện thoại đầu tiên có giá trị rất lớn; chiếc thứ hai (để làm việc riêng) vẫn có ích; đến chiếc thứ ba, thứ tư thì lợi ích thêm gần như không còn.</p><div class="mh">Nguồn gốc lý thuyết</div><p>Quy luật này thường gắn với <b>Hermann Heinrich Gossen</b> (1854, "quy luật Gossen thứ nhất"), được phát triển trong "cuộc cách mạng cận biên" thập niên 1870 bởi <b>W. S. Jevons, Carl Menger, Léon Walras</b>, và hệ thống hóa bởi <b>Alfred Marshall</b>. Nó giải thích vì sao đường cầu dốc xuống: muốn khách mua thêm thì giá phải thấp hơn.</p>
<div class="mh">Lỗi hay mắc trong bài thi</div><ul class="clean"><li>Phát biểu quy luật mà quên "trong điều kiện nhất định, các yếu tố khác không đổi".</li><li>Hiểu sai thành "khách chán sản phẩm". Phải nói rõ: vẫn thích, chỉ là lợi ích thêm nhỏ dần.</li><li>Áp dụng cho khoảng thời gian dài nhiều năm.</li></ul>`},
 {t:'Tình huống thảo luận: cốc cà phê thứ hai',
  b:`<p>Từ quy luật, cô đặt ba câu hỏi thực tế doanh nghiệp thường gặp:</p>
<ol class="clean"><li><b>Cốc cà phê thứ hai có mang lại lợi ích như cốc thứ nhất không?</b> Trong điều kiện thông thường (uống liên tiếp, các yếu tố khác không đổi), MU cốc thứ hai nhỏ hơn cốc thứ nhất. Điều này giải thích vì sao khách sẵn sàng mua cốc đầu với giá thông thường nhưng đến cốc thứ hai thì do dự.</li><li><b>Tại sao khách có thể thích mua thêm bánh thay vì thêm cà phê?</b> Khách không chỉ so MU của cà phê mà còn so với lợi ích của hàng hóa khác và giá của hai sản phẩm. Quyết định mua thêm liên quan đến cả các lựa chọn tiêu dùng khác.</li><li><b>Nếu khách ít mua cốc thứ hai, doanh nghiệp nên thu thập thông tin gì trước khi quyết định giảm giá?</b></li></ol>
<p><b>Hai học viên trả lời:</b> (a) nên giảm giá — ví dụ cốc đầu 40.000đ, cốc hai giảm còn 35.000đ; (b) không nên giảm vì giá cần ổn định, sau này khó bán; nên bán combo cà phê + bánh hoặc đồ uống khác.</p>
<p><b>Phản biện của cô với ý (a):</b> quyết định này không phải lúc nào cũng đúng. Giả sử cốc thứ nhất mang 10 đơn vị lợi ích ≈ 80.000đ, cốc thứ hai 8 đơn vị ≈ 60.000đ, trong khi giá bán 40.000đ. Lợi ích của cốc thứ hai vẫn lớn hơn số tiền phải trả, nên nếu khách có thời gian ngồi tiếp và không có nhu cầu chuyển sang món khác, họ vẫn gọi cốc thứ hai với giá 40.000đ — <b>không nhất thiết phải giảm giá</b>. Chỉ khi 8 đơn vị lợi ích đó chỉ tương đương khoảng 35.000đ thì giữ giá 40.000đ khách mới không mua, lúc đó mới xét có giảm hay không, giảm thế nào. Và ngay cả khi muốn giảm, còn phải so với <b>chi phí sản xuất</b>: nếu chi phí một cốc là 35.000đ thì không thể giảm xuống 30.000đ.</p>
<p><b>Phản biện với ý (b):</b> bán combo giúp "tiền khách tiêu cho món gì cũng vào túi cửa hàng", nhưng chưa tính đến quy luật: chưa chắc chiếc bánh đầu tiên có lợi ích cận biên bằng cốc cà phê thứ hai. Nếu khách không thích bánh ngọt, họ vẫn gọi hai cốc cà phê hoặc kết hợp món khác. Vẫn phải phân tích sở thích chi tiêu, chưa thể kết luận ngay có nên bán combo.</p>
<p><b>Kết luận của cô:</b> trước khi điều chỉnh giá phải thu thập thông tin về <b>sẵn sàng chi trả của khách, khả năng thay thế, lựa chọn của khách hàng và chi phí của doanh nghiệp</b>. Thông tin về MU giảm dần mới chỉ là một đầu vào. Kinh tế học giúp doanh nghiệp đặt đúng câu hỏi; để chọn chính sách cần kết hợp thông tin về nhu cầu và hiệu quả kinh tế.</p>`,
  m:`<div class="mh">Hiểu đơn giản — quy trình 3 câu hỏi trước khi giảm giá</div><ol class="clean"><li><b>Khách định giá đơn vị thêm bao nhiêu?</b> (WTP). Nếu WTP còn ≥ giá → không cần giảm.</li><li><b>Có món thay thế nào hấp dẫn hơn không?</b> Nếu khách đang chuyển sang món khác của chính cửa hàng thì không mất gì.</li><li><b>Giá mới còn trên chi phí không?</b> Bán thêm mà lỗ thì không nên.</li></ol>
<div class="mh">Cách trả lời nếu bị cô gọi tên</div><p>"Quy luật lợi ích cận biên giảm dần cho biết khách sẵn lòng trả ít hơn cho đơn vị mua thêm. Nhưng có giảm giá hay không còn phụ thuộc vào ba điều: mức sẵn lòng trả thực tế so với giá bán, khả năng thay thế, và giá mới có còn bù đủ chi phí không."</p>
<div class="mh">Liên hệ CĐ1</div><p>Đây là sự kết hợp Nguyên lý 3 (so MB với MC — phía khách: WTP với giá; phía cửa hàng: giá với chi phí) và Nguyên lý 2 (chi phí cơ hội: khách có thể dùng tiền mua bánh thay vì cà phê).</p>`},
 {t:'Ba hướng vận dụng của quy luật',
  b:`<p>Cô đưa ra ba hướng doanh nghiệp vận dụng quy luật vào giá bán, thiết kế sản phẩm và tổ chức kinh doanh.</p>
<p><b>Hướng 1 — Chính sách giá khuyến khích mua thêm.</b> Cốc cà phê đầu tiên mang lại hài lòng lớn (giải khát, thưởng thức); cốc thứ hai ngay sau đó thấp hơn đáng kể. Nếu bán cốc thứ hai bằng giá cốc thứ nhất, khách có thể không mua vì lợi ích bổ sung không còn đủ lớn so với số tiền. Nếu cốc thứ nhất 40.000đ, cốc thứ hai 25.000đ, quyết định có thể đổi. Tương tự cửa hàng thời trang: váy thứ hai giảm 50%. Đây là cơ sở kinh tế cho <b>chiết khấu theo số lượng, định giá theo mức tiêu dùng, giảm giá cho đơn vị mua thêm</b>.</p>
<p>Hai lưu ý của cô: (1) quy luật <b>không bắt buộc</b> doanh nghiệp phải giảm giá khi bán thêm — nếu mức sẵn sàng chi trả còn lớn hơn giá bán, khách vẫn mua; mức sẵn sàng chi trả phụ thuộc sở thích, hoàn cảnh tiêu dùng, khả năng lựa chọn hàng khác. (2) Khách mua thêm <b>chưa chắc doanh nghiệp có lợi nhuận cao hơn</b> — giảm còn 25.000đ mà chi phí 30.000đ thì không nên bán. Quy luật giúp hiểu vì sao khách cần mức giá thấp hơn để mua thêm, chứ <b>chưa trực tiếp xác định mức giá tối ưu</b>.</p>
<p><b>Hướng 2 — Phân khúc khách hàng và thiết kế quy cách sản phẩm.</b> Có khách chỉ muốn cốc nhỏ, có khách muốn cốc lớn. Khác biệt xuất phát từ sở thích, nhu cầu, mức tiêu dùng hiện tại và hoàn cảnh. Khi tăng dung tích từ 100ml lên 200ml, khách đang rất khát đánh giá cao phần thêm, khách chỉ thưởng thức hương vị thì thấy không cần thiết. Doanh nghiệp có thể thiết kế nhiều mức dung tích (nhỏ, vừa, lớn) với giá phù hợp. Cần phân biệt: quy luật MU giảm dần giải thích thay đổi lợi ích khi lượng tăng; còn phân khúc đòi hỏi nghiên cứu khác biệt sở thích, nhu cầu, mức sẵn sàng chi trả <b>giữa các nhóm khách</b>; vẫn cần dữ liệu thực tế để chọn dung tích và giá.</p>
<p><b>Hướng 3 — Phối hợp sản phẩm và thiết kế gói tiêu dùng.</b> Khách đã uống một cốc và không muốn cốc thứ hai (có người uống thêm sẽ mất ngủ — MU gần bằng 0), nhưng khi giới thiệu bánh ngọt thì có thể mua. Thay vì chỉ cố bán thêm cùng một sản phẩm, doanh nghiệp phối hợp sản phẩm khác (bánh, hoa quả, hạt hướng dương…) để đáp ứng nhu cầu đa dạng.</p>
<p><b>Case tăng giá trị giỏ hàng:</b> quán cà phê thấy phần lớn khách chỉ mua 1 cốc mỗi lượt, cân nhắc 3 phương án: (1) giảm giá cốc thứ hai từ 45.000 xuống 25.000đ — cần xác định bao nhiêu khách mua thêm nhờ mức giảm và chi phí cốc thứ hai; (2) tăng dung tích với phụ phí 8.000đ (100ml lên 200ml) — khách không phải mua cả cốc mới; (3) combo cà phê + bánh 70.000đ — bổ sung hàng hóa khác vào giỏ. Phương án nào? Tùy bối cảnh; một quán có thể kết hợp cả ba cho các nhóm khách khác nhau.</p>
<div class="note"><b>Bài học của cô:</b> không nên chỉ chọn phương án giúp tăng lượng bán hoặc doanh thu, mà phải xác định phương án mang lại lợi ích tăng thêm và phù hợp với nhu cầu, hành vi tiêu dùng của khách hàng.</div>`,
  m:`<div class="mh">Hiểu đơn giản</div><p>Ba hướng là ba cách "đón" khách ở đúng chỗ lợi ích của họ đang giảm: <b>(1)</b> hạ giá đơn vị thêm cho khớp với WTP đã giảm; <b>(2)</b> bán đúng "liều lượng" cho từng loại khách; <b>(3)</b> chuyển sang món khác mà khách còn thèm.</p>
<div class="mh">Tên gọi trong giáo trình (bổ sung)</div><ul class="clean"><li>Hướng 1 và 2 là các dạng <b>phân biệt giá cấp 2</b> (second-degree price discrimination): giá khác nhau theo lượng mua hoặc theo phiên bản sản phẩm, khách tự chọn.</li><li>Hướng 3 là <b>bán theo gói</b> (bundling).</li></ul>
<div class="mh">Ví dụ thêm từ doanh nghiệp</div><ul class="clean"><li><b>Hướng 1:</b> siêu thị "mua 2 tặng 1", giảm giá sản phẩm thứ hai; hãng taxi công nghệ giảm giá theo số chuyến trong tháng.</li><li><b>Hướng 2:</b> chuỗi cà phê bán size S/M/L; nhà mạng có nhiều gói data theo dung lượng; hãng hàng không chia hạng phổ thông, phổ thông đặc biệt, thương gia.</li><li><b>Hướng 3:</b> combo burger + khoai + nước của chuỗi đồ ăn nhanh; khách sạn bán gói phòng + ăn sáng + spa.</li></ul><div class="mh">Lỗi hay mắc</div><p>Đề xuất "giảm giá để tăng doanh số" mà không nói đến WTP và chi phí — đúng loại câu trả lời cô đã phản biện trên lớp.</p>`},
 {t:'Đường bàng quan và sự đánh đổi trong tiêu dùng',
  b:`<p class="small muted">Bản ghi thiếu đoạn định nghĩa đường bàng quan; phần dưới từ đoạn cuối buổi.</p>
<p>Khi khách lựa chọn giữa thêm cà phê hoặc thêm bánh ngọt, đây là hai hàng hóa trong cùng một bài toán lựa chọn — <b>không nhất thiết phải cạnh tranh với nhau</b>. Cô đưa ra quy trình ba bước:</p>
<ol class="clean"><li><b>Xác định những hàng hóa khách hàng có thể đánh đổi trong tiêu dùng.</b></li><li><b>Đo lường mức độ sẵn sàng đánh đổi.</b> Không chỉ hỏi khách thích cà phê hay bánh, mà hỏi cụ thể: tại lượng tiêu dùng hiện có, khách sẵn sàng bớt bao nhiêu bánh để có thêm cà phê, hoặc ngược lại. Khái quát: khách sẵn sàng đánh đổi nhiều hay ít hàng hóa khác để có sản phẩm của doanh nghiệp — con số này đo <b>sức hấp dẫn tương đối</b> của sản phẩm.</li><li><b>Vận dụng vào kinh doanh.</b> Nếu khách đã uống nhiều cà phê và không muốn bớt bánh để lấy thêm cà phê, cửa hàng có thể nghiên cứu gói một cốc cà phê + bánh thay vì chỉ giảm giá. Nếu khách muốn uống nhiều cà phê hơn, cỡ lớn hoặc giảm giá phần mua thêm nên được thử nghiệm.</li></ol>
<p><b>Phân biệt</b> mức sẵn sàng đánh đổi theo sở thích với tỷ lệ đánh đổi do giá thị trường quy định: khách có thể sẵn sàng bỏ một lượng bánh để có thêm cà phê, nhưng khi mua thực tế họ đối diện giá từng sản phẩm. Vì vậy doanh nghiệp có thể điều chỉnh giá tương đối hoặc cơ cấu gói.</p>
<div class="note"><b>Câu chốt của cô:</b> MRS (tỷ lệ thay thế cận biên) không tự xác định đối thủ, không đưa ra giá tối ưu hay combo tối ưu. Nó giúp đi qua các bước: xác định hàng hóa khách lựa chọn → đo sự sẵn sàng đánh đổi → đưa thông tin đó vào phân tích phương án kinh doanh.</div>
<p>Buổi 12/11 dừng ở phần lợi ích: đo lường lợi ích, quy luật MU giảm dần và đo sự đánh đổi giữa các hàng hóa.</p>`,
  m:`<div class="mh">Đường bàng quan là gì? (bổ sung)</div><p><b>Đường bàng quan</b> (indifference curve) là tập hợp các tổ hợp hai hàng hóa mang lại <b>cùng một mức lợi ích</b> cho người tiêu dùng — họ "bàng quan", không phân biệt tổ hợp nào hơn. Ví dụ (2 cà phê, 1 bánh) và (1 cà phê, 3 bánh) có thể cùng hài lòng như nhau.</p>
<div class="mh">MRS — tỷ lệ thay thế cận biên</div><div class="formula">MRS = −ΔY/ΔX = MU<sub>X</sub> / MU<sub>Y</sub></div><p>MRS cho biết khách sẵn sàng bỏ bao nhiêu đơn vị Y (bánh) để có thêm 1 đơn vị X (cà phê) mà vẫn hài lòng như cũ. MRS chính là độ dốc của đường bàng quan.</p><p><b>Vì sao MRS giảm dần?</b> Càng có nhiều cà phê, MU của cà phê càng nhỏ (quy luật MU giảm dần), nên khách càng ít sẵn lòng bỏ bánh để lấy thêm cà phê. Đây là sợi dây nối giữa hai nửa buổi học.</p>
<div class="mh">Ví dụ thêm</div><p>Một người chia thời gian rảnh buổi tối giữa xem phim và tập thể thao. Họ có thể hài lòng như nhau với "2 giờ phim, 1 giờ tập" hoặc "1 giờ phim, 2 giờ tập" — hai điểm trên cùng một đường bàng quan. Đã xem phim rất nhiều thì không muốn bớt thêm giờ tập để xem tiếp (MRS giảm).</p><div class="mh">Sẽ học buổi 13/11</div><p>"Tỷ lệ đánh đổi do giá thị trường quy định" chính là Px/Py — độ dốc của đường ngân sách. Kết hợp với MRS sẽ ra điều kiện lựa chọn tối ưu.</p>`},
 {t:'Ràng buộc ngân sách và lựa chọn tối ưu',soon:true,
  b:`<p class="muted">Học buổi 13/11. Cô báo: lợi ích thì mong muốn nhiều nhưng ngân sách có hạn, nên ràng buộc ngân sách khiến người tiêu dùng phải có lựa chọn tối ưu. Sẽ cập nhật sau khi có ghi âm hoặc slide.</p>`,
  m:`<div class="mh">Chuẩn bị trước (bổ sung)</div><p><b>Đường ngân sách:</b> tập hợp các tổ hợp hàng hóa mua được khi tiêu hết thu nhập I.</p><div class="formula">I = Px·X + Py·Y &nbsp;→&nbsp; độ dốc = −Px/Py</div><ul class="clean"><li>Thu nhập tăng: đường ngân sách dịch song song ra ngoài.</li><li>Giá một hàng thay đổi: đường xoay quanh điểm chặn trên trục hàng kia.</li></ul><p><b>Lựa chọn tối ưu:</b> điểm trên đường ngân sách chạm vào đường bàng quan cao nhất (tiếp điểm), tại đó:</p><div class="formula">MRS = Px/Py &nbsp;⇔&nbsp; MU<sub>X</sub>/P<sub>X</sub> = MU<sub>Y</sub>/P<sub>Y</sub></div><p><b>Ý nghĩa:</b> đồng tiền cuối cùng chi cho mỗi hàng hóa phải mang lại lợi ích như nhau. Nếu 1.000đ chi cho cà phê mang lại nhiều lợi ích hơn 1.000đ chi cho bánh thì nên chuyển tiền từ bánh sang cà phê, cho đến khi hai bên bằng nhau.</p><p><b>Ví dụ dễ nhớ:</b> giống phân bổ thời gian ôn thi giữa hai môn: dồn thêm giờ cho môn nào mà mỗi giờ thêm giúp tăng điểm nhiều hơn, cho đến khi một giờ thêm ở môn nào cũng giúp tăng điểm như nhau.</p>`}
 ],
 sum:{core:'Khách sẵn lòng trả ít hơn cho đơn vị mua thêm vì lợi ích cận biên giảm dần. Doanh nghiệp vận dụng qua giá, quy cách và combo — nhưng chỉ sau khi biết mức sẵn lòng trả, hàng thay thế và chi phí.',
  pillars:[['TU','Tổng lợi ích','Cộng dồn','var(--ktud)'],['MU','Cận biên','Giảm dần','var(--gold)'],['WTP','Sẵn lòng trả','Đi theo MU','var(--qtcl)'],['MRS','Đánh đổi','Theo sở thích','var(--violet)']],
  recap:['<b>MU = TU sau − TU trước.</b> MU = 0 là điểm bão hòa, TU lớn nhất.','<b>MU giảm dần</b> trong ngắn hạn, không có nghĩa khách hết thích.','<b>WTP giảm theo MU</b> → không mặc định khách mua thêm với cùng giá, nhưng cũng không mặc định phải giảm giá.','<b>Ba hướng:</b> giá cho phần mua thêm, quy cách theo phân khúc, combo.','<b>MRS ≠ Px/Py:</b> sở thích khác giá thị trường; MRS không tự cho ra giá hay combo tối ưu.'],
  exam:['Tính MU từ bảng TU; điểm bão hòa','Phát biểu quy luật kèm 2 giới hạn','Tình huống "có nên giảm giá đơn vị thứ hai?"','Ba hướng vận dụng và lưu ý','MRS và tỷ lệ giá thị trường; điều kiện tối ưu'],
  terms:[['Tổng lợi ích','Total utility'],['Lợi ích cận biên','Marginal utility'],['Điểm bão hòa','Satiation point'],['Sẵn lòng chi trả','Willingness to pay'],['Bán theo gói','Bundling'],['Đường bàng quan','Indifference curve'],['Tỷ lệ thay thế cận biên','MRS'],['Đường ngân sách','Budget line']]}},

SUBJ.ktud.bridge=[['Chi phí cơ hội','Giá trị đất, tài sản sẵn có đưa vào dự án; suất chiết khấu là chi phí cơ hội của vốn'],['Chi phí chìm','Chi phí khảo sát, lập dự án, thiết kế đã chi — không đưa vào quyết định đi tiếp hay dừng'],['Tư duy cận biên','Dòng tiền tăng thêm: so kịch bản có và không có dự án'],['LN kinh tế > 0','Tương đương NPV > 0 ở suất chiết khấu bằng chi phí vốn'],['Đánh đổi','Phân bổ vốn giữa các dự án trong kế hoạch đầu tư năm'],['Độ co giãn','Giả định sản lượng trong dự báo doanh thu; phân tích độ nhạy theo giá'],['Cú sốc cung/cầu','Kịch bản trong phân tích rủi ro: xe điện, giá dầu, giá vật liệu'],['Khuyến khích','KPI, giao khoán, thưởng tiến độ cho nhà thầu và ban quản lý dự án'],['MU giảm dần','Hiệu quả giảm khi mở thêm cửa hàng trong cùng khu vực; quy mô tối ưu không phải lớn nhất']];

SUBJ.ktud.work={
 ex:[
  {t:'Nhà sách',cd:'CĐ1',q:'Một người định mở nhà sách tại tầng 1–2 nhà gia đình ở trung tâm. Đầu tư ban đầu 800 triệu (sửa mặt bằng, kệ, máy tính…). Nếu không mở, hai tầng cho thuê được 25 triệu/tháng. Người này đang làm quản lý marketing lương 30 triệu/tháng, sẽ nghỉ việc. Vốn nhập sách 400 triệu, nếu gửi ngân hàng lãi 7%/năm. Doanh thu dự kiến 180 triệu/tháng; chi phí vận hành trực tiếp 120 triệu/tháng. Xác định chi phí kế toán, chi phí cơ hội, LN kế toán, LN kinh tế; có nên mở?',
   steps:['<b>Chi phí kế toán (hiện)</b>: chi phí vận hành 120tr/tháng (nhập sách bổ sung, điện nước, nhân viên, marketing). Khoản đầu tư 800tr cũng là chi phí kế toán, ghi nhận dần qua khấu hao: 800tr / 60 tháng ≈ 13,33tr/tháng.','<b>Chi phí cơ hội (ẩn)</b>: (1) tiền thuê nhà bị bỏ 25tr; (2) lương bị bỏ 30tr; (3) lãi tiền gửi bị bỏ của 400tr: 400 × 7% / 12 ≈ 2,33tr; (4) nếu chặt chẽ hơn: lãi của 800tr đầu tư ban đầu: 800 × 7% / 12 ≈ 4,67tr.','<b>LN kế toán</b> = 180 − 120 − 13,33 ≈ 46,67tr/tháng (hoặc 60tr nếu chưa tính khấu hao).','<b>Tổng chi phí cơ hội</b> = 25 + 30 + 2,33 + 4,67 = 62tr/tháng (hoặc 57,33tr nếu chỉ tính 3 khoản đề bài liệt kê).','<b>LN kinh tế</b> = 46,67 − 62 ≈ <b>−15,3tr/tháng</b> (cách đầy đủ). Theo cách đơn giản (chưa tính khấu hao và lãi của 800tr): 60 − 57,33 ≈ +2,67tr/tháng, gần như hòa vốn kinh tế.'],
   ans:'Theo cách tính đầy đủ, LN kinh tế âm khoảng 15 triệu/tháng → <b>không nên mở</b> (trừ khi có lợi ích phi tài chính như đam mê, tự chủ). Nếu chỉ nhìn LN kế toán 46–60 triệu/tháng sẽ tưởng là "lãi lớn" — đó chính là sai lầm cô muốn chỉ ra.',
   trap:'Đề không nói rõ cách xử lý 800 triệu đầu tư, nên khi làm bài phải <b>nêu rõ giả định</b> (khấu hao bao nhiêu năm, có tính lãi cơ hội không). Hai đáp án khác nhau đều được chấp nhận nếu giả định rõ ràng.'},
  {t:'Chuyến giao thêm 10.000 lít',cd:'CĐ1',q:'Khách công nghiệp đặt thêm 10.000 lít. Đóng góp sau giá vốn 300đ/lít; chi phí vận chuyển tăng thêm 2,2 triệu; chi phí giao nhận khác 0,3 triệu. Có nên giao?',
   steps:['Lợi ích tăng thêm = 10.000 × 300 = 3,0 triệu.','Chi phí tăng thêm = 2,2 + 0,3 = 2,5 triệu.','Lợi ích ròng = 3,0 − 2,5 = +0,5 triệu > 0.'],
   ans:'<b>Nên giao</b> (theo giả định không có chi phí khác).',trap:'Nếu xe bồn phải bỏ một chuyến khác lãi 1 triệu, chi phí cơ hội 1 triệu phải cộng vào MC → MC = 3,5 triệu > 3,0 → <b>không nên giao</b>.'},
  {t:'Đơn diesel 50.000 lít',cd:'CĐ1',q:'Đơn bổ sung 50.000 lít, không ảnh hưởng cam kết hiện tại. Doanh thu 1.000 triệu; giá vốn và chi phí biến đổi 985 triệu; giao nhận và xử lý bổ sung 8 triệu. Biên đóng góp thấp — có nên từ chối?',
   steps:['Doanh thu tăng thêm 1.000 triệu.','Chi phí tăng thêm 985 + 8 = 993 triệu.','Lợi ích ròng = +7 triệu.'],
   ans:'<b>Có thể chấp nhận</b> — biên thấp nhưng vẫn dương.',trap:'Phải xem thêm chi phí vốn (bán chịu bao lâu?), rủi ro thanh toán, công nợ. Nếu khách trả chậm 60 ngày, chi phí vốn của 1.000 triệu có thể ăn hết 7 triệu lãi.'},
  {t:'Máy bay 200 ghế',cd:'CĐ1',q:'Chuyến bay 200 ghế tốn 20.000 USD (trung bình 100 USD/ghế). Sắp cất cánh, còn 10 ghế trống, một khách chờ sẵn sàng trả 80 USD. Có nên bán?',
   steps:['Chi phí cận biên của thêm 1 khách: gần như bằng 0 (chuyến bay vẫn bay; chỉ thêm suất ăn, chút nhiên liệu).','Lợi ích cận biên = 80 USD.','MB (80) > MC (≈ vài USD).'],
   ans:'<b>Nên bán</b>.',trap:'Con số 100 USD là chi phí trung bình, không phải chi phí cận biên. Dùng chi phí trung bình cho quyết định thêm một đơn vị là lỗi kinh điển.'},
  {t:'Tăng giá hay giảm giá',cd:'CĐ2',q:'Giá 20.000đ, bán 1.000 đơn vị. Sau tăng giá: 22.000đ, bán 930 đơn vị. Tính doanh thu trước/sau và độ co giãn. Doanh thu tăng có đồng nghĩa lợi nhuận tăng?',
   steps:['TR trước = 20.000 × 1.000 = 20,0 triệu; TR sau = 22.000 × 930 = 20,46 triệu → +2,3%.','Giá trung bình 21.000; lượng trung bình 965.','%ΔQ = −70 / 965 ≈ −7,25%; %ΔP = 2.000 / 21.000 ≈ 9,52%.','E = −7,25 / 9,52 ≈ −0,76 → |E| < 1: cầu kém co giãn.'],
   ans:'Cầu kém co giãn nên tăng giá làm doanh thu tăng (lượng bán giảm 7% nhưng doanh thu vẫn +2,3%). Lợi nhuận tăng hay không còn phụ thuộc chi phí — cần thêm số liệu.',trap:'Tính % theo giá gốc sẽ ra E = −7%/10% = −0,7; vẫn kết luận được kém co giãn, nhưng nên ghi rõ dùng phương pháp nào.'},
  {t:'Co giãn chéo vận tải',cd:'CĐ2',q:'Giá dịch vụ vận tải A tăng 10%, cầu dịch vụ B tăng 6%. Tính E chéo, kết luận quan hệ, hàm ý cạnh tranh.',
   steps:['E<sub>BA</sub> = %ΔQ<sub>B</sub> / %ΔP<sub>A</sub> = 6% / 10% = +0,6.','E > 0 → hai dịch vụ thay thế nhau.'],
   ans:'Thay thế. Khi đối thủ A tăng giá, B có cơ hội thu hút thêm khách mà không cần giảm giá.',trap:'Dấu của E chéo mới quan trọng; độ lớn 0,6 cho biết mức thay thế vừa phải.'},
  {t:'Cú sốc kép thị trường xăng dầu',cd:'CĐ2',q:'Vận chuyển gián đoạn làm chi phí nhập tăng, cùng lúc kinh tế chững lại khiến doanh nghiệp vận tải cắt giảm nhiên liệu. Giá và lượng cân bằng thay đổi thế nào?',
   steps:['Cú sốc 1: chi phí tăng → cung giảm (đường S dịch trái) → đẩy P lên, kéo Q xuống.','Cú sốc 2: cầu giảm (đường D dịch trái) → kéo P xuống, kéo Q xuống.','Q: cả hai cùng kéo xuống → chắc chắn giảm. P: một lực lên, một lực xuống → chưa xác định.'],
   ans:'<b>Q giảm, P chưa xác định</b>. Cú sốc cung mạnh hơn thì giá tăng; cú sốc cầu mạnh hơn thì giá giảm → phải lập hai kịch bản.',trap:'Đừng kết luận "giá tăng" chỉ vì chi phí tăng — đây là cú sốc kép.'},
  {t:'Cốc cà phê thứ hai',cd:'CĐ3',q:'Giá cà phê 40.000đ. Cốc 1 mang 10 đơn vị lợi ích (≈ 80.000đ), cốc 2 mang 8 đơn vị (≈ 60.000đ). Khách ít gọi cốc 2. Có nên giảm giá cốc 2 xuống 35.000đ?',
   steps:['So WTP cốc 2 (60.000đ) với giá (40.000đ): WTP > giá → khách vẫn có lợi khi mua.','Vậy khách ít gọi không phải vì giá; có thể do thời gian, sở thích, có món thay thế.','Nếu khảo sát thấy WTP thực tế chỉ ≈ 35.000đ → giữ 40.000đ khách không mua; lúc đó mới xét giảm.','Khi giảm phải kiểm tra giá mới ≥ chi phí một cốc.'],
   ans:'Với số liệu đề cho: <b>không cần giảm giá</b>. Trước khi giảm cần biết WTP, khả năng thay thế, lựa chọn của khách và chi phí.',trap:'"MU giảm dần nên phải giảm giá" là suy luận sai mà cô đã phản biện trên lớp.'}
 ],
 discuss:['<b>Giá trần xăng dầu:</b> hiện tượng ngắn hạn, dài hạn; khó khăn của DN khi giá thế giới cao hơn trần; rủi ro nguồn cung cho DN dùng xăng dầu làm đầu vào; kịch bản rủi ro của CEO vận tải. <i>Gợi ý trả lời xem ở chủ đề "Giá trần và giá sàn", phần mở rộng.</i>','<b>Thuế nhiên liệu +1.000đ/lít:</b> giá mua, giá thực nhận, lượng bán; cần biết gì để xác định ai chịu thuế; 2 biện pháp ứng phó trong phạm vi quyền hạn. <i>Gợi ý ở chủ đề "Thuế và trợ cấp".</i>','<b>Trợ giá đại trà hay hỗ trợ trực tiếp:</b> ai hưởng lợi, lượng tiêu dùng và ngân sách thay đổi ra sao.','<b>Nhu cầu xăng dầu 5 năm tới:</b> tác động của xe điện, thu nhập, nhu cầu đi lại; ngắn hạn hay dài hạn; chỉ báo theo dõi theo khu vực.','<b>Liên hệ doanh nghiệp (CĐ1):</b> nguồn lực "miễn phí" có chi phí cơ hội; dự án tiếp tục chỉ vì đã đầu tư nhiều; KPI đạt nhưng không hiệu quả.'],
 todo:['Họp nhóm chốt dàn ý và chia việc','Chỉnh Phần I theo bài giảng CĐ3 của cô','Thu thập số liệu Petrolimex (BCTN 2025, E10, Petrolimex ID)','Hỏi cô hướng làm bài buổi 25/11','Ghép bản thảo 10–12 trang (29/11)','Kiểm tra tình trạng nghị định xăng dầu mới','Định dạng Word, làm slide, tập thuyết trình','Gửi email nộp bài sáng 5/12']
};

SUBJ.ktud.quiz=[
 {cd:'CĐ1',k:'Trắc nghiệm',q:'Chi phí cơ hội của một lựa chọn là gì?',o:['Tổng giá trị mọi phương án bị bỏ','Giá trị phương án thay thế tốt nhất bị bỏ','Chi phí kế toán của phương án','Khoản đã chi không thu hồi'],a:1,e:'Mỗi lúc chỉ làm được một phương án, nên cái thực sự mất là phương án tốt nhất còn lại.',w:['A sai: không thể làm tất cả phương án bị bỏ cùng lúc, cộng lại là đếm thứ không bao giờ có.','C sai: chi phí kế toán chỉ là chi phí hiện, thiếu chi phí ẩn.','D sai: đó là chi phí chìm.']},
 {cd:'CĐ1',k:'Trắc nghiệm',q:'Doanh thu 5 tỷ, chi phí kế toán 3,8 tỷ, nếu không làm thì cho thuê mặt bằng được 1,5 tỷ. Lợi nhuận kinh tế là?',o:['+1,2 tỷ','+0,3 tỷ','−0,3 tỷ','−1,5 tỷ'],a:2,e:'LN kinh tế = 5,0 − 3,8 − 1,5 = −0,3 tỷ.',w:['A là LN kế toán (chưa trừ chi phí cơ hội).','B sai dấu: 1,5 − 1,2.','D chỉ là chi phí cơ hội, chưa tính doanh thu và chi phí kế toán.']},
 {cd:'CĐ1',k:'Trắc nghiệm',q:'Công ty dùng kho tự sở hữu: chi phí vận hành 400 triệu/năm, nếu cho thuê thu 600 triệu/năm. Chi phí kinh tế của việc tự dùng kho là?',o:['400 triệu','600 triệu','1.000 triệu','200 triệu'],a:2,e:'Chi phí kinh tế = chi phí hiện 400 + chi phí ẩn 600 = 1.000 triệu.',w:['A thiếu chi phí ẩn (tiền thuê bị bỏ).','B thiếu chi phí vận hành.','D là hiệu số, không có ý nghĩa ở đây.']},
 {cd:'CĐ1',k:'Trắc nghiệm',q:'Khoản nào KHÔNG được đưa vào quyết định có tiếp tục dự án hay không?',o:['Chi phí còn phải chi','Doanh thu dự kiến','Khoản đã chi, không thu hồi được','Chi phí cơ hội của đất'],a:2,e:'Chi phí chìm có mặt ở cả hai kịch bản (đi tiếp hay dừng) nên triệt tiêu khi so sánh.',w:['A, B là phần thay đổi từ nay — phải xét.','D là chi phí cơ hội — phải xét.']},
 {cd:'CĐ1',k:'Tính toán',q:'Dự án đã chi 5 tỷ (không thu hồi). Nếu chi thêm 2 tỷ sẽ thu về 1,5 tỷ. Tiếp tục hay dừng?',ans:'Dừng',e:'Lợi ích tăng thêm = 1,5 − 2 = −0,5 tỷ < 0. Khoản 5 tỷ không đổi giữa hai lựa chọn nên không ảnh hưởng. Ngược lại, nếu thu về 3 tỷ thì +1 tỷ → tiếp tục.'},
 {cd:'CĐ1',k:'Tính toán',q:'MB của nhân viên thứ 1–4 lần lượt 1.125; 945; 765; 585 nghìn đ/ca, MC = 700 nghìn đ/ca. Nên thuê thêm mấy người?',ans:'3 người',e:'Ròng: +425, +245, +65, −115. Thuê đến người thứ 3 (còn dương), dừng trước người thứ 4. Nếu có ràng buộc dịch vụ (thời gian chờ tối đa) thì chỉ tối ưu trong các phương án đáp ứng ràng buộc.'},
 {cd:'CĐ1',k:'Trắc nghiệm',q:'Máy bay 200 ghế, chi phí trung bình 100 USD/ghế, sắp cất cánh còn ghế trống. Khách trả 80 USD. Theo nguyên lý cận biên:',o:['Không bán vì 80 < 100','Bán vì chi phí cận biên của thêm 1 khách gần bằng 0','Chỉ bán nếu khách trả ≥ 100 USD','Không đủ thông tin'],a:1,e:'Quyết định "thêm một" phải so với chi phí cận biên, không phải chi phí trung bình.',w:['A, C dùng sai chi phí trung bình.','D sai: đủ thông tin để kết luận theo nguyên lý cận biên.']},
 {cd:'CĐ1',k:'Trắc nghiệm',q:'Thưởng 20% doanh thu vượt chỉ tiêu làm doanh thu +18% nhưng lợi nhuận gộp −10%, tái ký giảm. Nguyên nhân gốc?',o:['Nhân viên thiếu năng lực','Cơ chế thưởng gắn sai mục tiêu','Thị trường suy giảm','Giá vốn tăng'],a:1,e:'Nhân viên phản ứng hợp lý với thứ được thưởng (doanh thu), kể cả bằng giảm giá sâu.',w:['A sai: họ vượt chỉ tiêu, không thiếu năng lực.','C sai: doanh thu tăng 18%, thị trường không suy giảm.','D: đề không nói giá vốn tăng; giảm lãi gộp do giảm giá bán.']},
 {cd:'CĐ1',k:'Trắc nghiệm',q:'Phương án điều chỉnh cơ chế thưởng mà cô cho là phù hợp hơn với Công ty X?',o:['Giữ thưởng doanh thu','Chỉ thưởng lợi nhuận gộp','Kết hợp nhiều tiêu chí: lợi nhuận gộp, tái ký, kiểm soát chiết khấu','Bỏ hẳn thưởng'],a:2,e:'Phương án C cân bằng lợi nhuận, khách hàng và chất lượng bán hàng; nên thử nghiệm trước khi áp dụng rộng.',w:['A chưa xử lý tác động ngược.','B kiểm soát giảm giá nhưng ít chú ý quan hệ dài hạn.','D làm mất động lực.']},
 {cd:'CĐ1',k:'Tự luận',q:'Phân tích một KPI tại doanh nghiệp anh/chị khiến nhân viên đạt chỉ tiêu nhưng chưa chắc mang lại hiệu quả tốt nhất. Đề xuất điều chỉnh.',ans:'Dàn ý',e:'<b>Mở:</b> nêu Nguyên lý 4 — con người phản ứng với động cơ khuyến khích; đạt KPI chưa chắc đạt mục tiêu. <b>Thân:</b> (1) mô tả KPI (ví dụ: chuỗi bán lẻ thưởng cửa hàng trưởng theo doanh thu tháng); (2) "nếu tôi là cửa hàng trưởng" → khuyến mãi dồn dập cuối tháng, nhập thừa hàng để không hết hàng; (3) hệ quả: biên lợi nhuận giảm, hàng tồn, hủy hàng tăng; (4) đề xuất: kết hợp doanh thu với lợi nhuận gộp, tỷ lệ hàng hủy, điểm hài lòng khách; thử nghiệm ở một số cửa hàng. <b>Kết:</b> thiết kế khuyến khích sao cho lợi ích người thực hiện gắn với mục tiêu thật.'},
 {cd:'CĐ2',k:'Trắc nghiệm',q:'Giá xăng tăng làm lượng mua giảm. Đây là:',o:['Dịch chuyển đường cầu','Di chuyển dọc đường cầu','Dịch chuyển đường cung','Mất thị phần'],a:1,e:'Giá của chính hàng hóa thay đổi → thay đổi lượng cầu, di chuyển dọc đường.',w:['A: chỉ khi yếu tố ngoài giá thay đổi.','C: không liên quan phía cung.','D: mất thị phần là khách sang đối thủ.']},
 {cd:'CĐ2',k:'Trắc nghiệm',q:'Nhiều người chuyển sang xe điện. Đường cầu xăng:',o:['Dịch sang phải','Dịch sang trái','Không đổi, chỉ di chuyển dọc','Dốc hơn'],a:1,e:'Thị hiếu và hàng thay thế (xe điện) là yếu tố ngoài giá → ở mọi mức giá người ta mua ít xăng hơn.',w:['A: là cầu tăng.','C: chỉ khi giá xăng thay đổi.','D: độ dốc không phải điều đề hỏi.']},
 {cd:'CĐ2',k:'Trắc nghiệm',q:'Một cửa hàng xăng mất khách vì đối thủ mở cửa hàng mới gần đó. Đây là:',o:['Cầu thị trường giảm','Lượng cầu giảm','Mất thị phần','Cung giảm'],a:2,e:'Tổng cầu thị trường khu vực không đổi; khách chỉ chuyển sang người bán khác.',w:['A, B nhầm doanh số một cửa hàng với cầu toàn thị trường.','D không liên quan.']},
 {cd:'CĐ2',k:'Tính toán',q:'Giá từ 20.000đ lên 22.000đ, lượng bán từ 1.000 xuống 930. Tính độ co giãn (trung điểm) và nhận xét doanh thu.',ans:'E ≈ −0,76',e:'%ΔQ = −70/965 ≈ −7,25%; %ΔP = 2.000/21.000 ≈ 9,52%; E ≈ −0,76 → kém co giãn. Doanh thu 20,0 → 20,46 triệu (+2,3%). Doanh thu tăng chưa chắc lợi nhuận tăng.'},
 {cd:'CĐ2',k:'Trắc nghiệm',q:'Giá tăng 5%, lượng cầu giảm 2%. Hệ số co giãn theo giá và loại cầu?',o:['−2,5; co giãn nhiều','−0,4; co giãn ít','−0,4; co giãn nhiều','−2,5; co giãn ít'],a:1,e:'E = −2%/5% = −0,4; |E| < 1 → co giãn ít.',w:['A, D chia ngược (5/2).','C đúng số nhưng sai kết luận: |E| < 1 là co giãn ít.']},
 {cd:'CĐ2',k:'Trắc nghiệm',q:'Giá dịch vụ A tăng 10%, cầu dịch vụ B tăng 6%. Hai dịch vụ là:',o:['Bổ sung','Thay thế','Hàng thứ cấp','Không liên quan'],a:1,e:'E chéo = +0,6 > 0 → thay thế.',w:['A: bổ sung có E chéo âm.','C: hàng thứ cấp liên quan đến thu nhập, không phải giá chéo.','D: E ≈ 0 mới là không liên quan.']},
 {cd:'CĐ2',k:'Trắc nghiệm',q:'Thu nhập tăng 10%, lượng cầu một hàng hóa giảm 3%. Đây là:',o:['Hàng xa xỉ','Hàng thông thường','Hàng thứ cấp','Hàng bổ sung'],a:2,e:'E thu nhập = −0,3 < 0 → hàng thứ cấp.',w:['A: E thu nhập > 1.','B: E thu nhập > 0.','D: khái niệm của co giãn chéo.']},
 {cd:'CĐ2',k:'Trắc nghiệm',q:'Cầu kém co giãn theo giá. Nếu tăng giá thì tổng doanh thu:',o:['Tăng','Giảm','Không đổi','Không xác định'],a:0,e:'% giảm lượng nhỏ hơn % tăng giá, nên P × Q tăng.',w:['B: đúng khi cầu co giãn nhiều.','C: khi co giãn đơn vị.']},
 {cd:'CĐ2',k:'Trắc nghiệm',q:'Cung giảm và cầu tăng cùng lúc. Kết quả:',o:['P tăng, Q chưa xác định','P giảm, Q tăng','P chưa xác định, Q tăng','P và Q cùng giảm'],a:0,e:'Cung giảm đẩy P lên; cầu tăng cũng đẩy P lên → P tăng chắc chắn. Q: cung giảm kéo xuống, cầu tăng kéo lên → chưa xác định.'},
 {cd:'CĐ2',k:'Trắc nghiệm',q:'Gián đoạn vận chuyển làm cung xăng giảm, đồng thời kinh tế chững làm cầu giảm. Kết luận:',o:['P tăng, Q giảm','P giảm, Q giảm','Q giảm, P chưa xác định','P tăng, Q chưa xác định'],a:2,e:'Hai cú sốc cùng kéo Q xuống; về giá thì một lực lên, một lực xuống → phải lập kịch bản.'},
 {cd:'CĐ2',k:'Trắc nghiệm',q:'Giá trần chỉ có hiệu lực khi:',o:['Cao hơn giá cân bằng','Thấp hơn giá cân bằng','Bằng giá cân bằng','Luôn có hiệu lực'],a:1,e:'Trần thấp hơn P₀ mới ràng buộc → Qd > Qs → thiếu hụt, phân bổ phi giá.',w:['A: trần cao hơn giá thị trường thì không ai chạm tới.','C: không gây thay đổi.']},
 {cd:'CĐ2',k:'Trắc nghiệm',q:'Giá sàn có hiệu lực sẽ gây ra:',o:['Thiếu hụt','Dư thừa','Giá giảm','Lượng cầu tăng'],a:1,e:'Sàn cao hơn P₀ → người bán muốn bán nhiều, người mua mua ít → dư thừa, tồn kho.'},
 {cd:'CĐ2',k:'Trắc nghiệm',q:'Thuế theo đơn vị đánh vào xăng, cầu kém co giãn hơn cung. Ai chịu phần lớn thuế?',o:['Người bán','Người mua','Chia đều','Nhà nước'],a:1,e:'Bên kém co giãn tương đối (khó né) chịu phần lớn.',w:['A đúng khi cung kém co giãn hơn.','D: Nhà nước thu thuế, không chịu thuế.']},
 {cd:'CĐ2',k:'Trắc nghiệm',q:'Khi Nhà nước trợ cấp theo đơn vị cho người bán:',o:['Giá người mua trả tăng, lượng giảm','Giá người mua trả giảm, giá người bán nhận tăng, lượng tăng','Chỉ người bán hưởng lợi','Lượng giao dịch không đổi'],a:1,e:'Cung dịch xuống một khoản s; chênh lệch giá bán nhận và giá mua trả bằng s; lợi ích chia cho hai bên theo độ co giãn.',w:['A là tác động của thuế.','C sai: người nhận trợ cấp theo quy định không nhất thiết hưởng toàn bộ lợi ích.']},
 {cd:'CĐ2',k:'Tính toán',q:'Thuế 1.000đ/lít, E_S = 2,33, |E_D| = 1. Người mua chịu bao nhiêu? (công thức bổ sung)',ans:'≈ 700đ',e:'Phần người mua = E_S / (E_S + |E_D|) = 2,33 / 3,33 ≈ 70% → 700đ; người bán 300đ — khớp ví dụ trong slide.'},
 {cd:'CĐ2',k:'Tự luận',q:'Phân tích chính sách giá trần xăng dầu theo khung 5 bước và đề xuất ứng phó cho doanh nghiệp đầu mối.',ans:'Dàn ý',e:'<b>1. Mục tiêu:</b> bảo vệ người tiêu dùng, kiềm chế lạm phát. <b>2. Cơ chế:</b> giá tối đa; chỉ có hiệu lực khi thấp hơn P₀ (vẽ đồ thị). <b>3. Thị trường:</b> ngắn hạn thiếu hụt, xếp hàng, phân bổ phi giá; dài hạn DN giảm nhập, giảm đầu tư, cung giảm thêm. <b>4. Doanh nghiệp:</b> lỗ khi giá thế giới > trần, áp lực dòng tiền, rủi ro uy tín khi thiếu hàng. <b>5. Quyết định:</b> hợp đồng nhập dài hạn, điều phối liên vùng, quản lý tồn kho, ưu tiên khách hợp đồng, kiến nghị cơ chế. Liên hệ: cơ chế giá cơ sở và Quỹ bình ổn, đợt thiếu hàng cuối 2022, dự thảo nghị định mới.'},
 {cd:'CĐ3',k:'Tính toán',q:'Tổng lợi ích của cốc 1 đến cốc 4 lần lượt là 12, 20, 25, 25. Tính MU từng cốc và chỉ ra điểm bão hòa.',ans:'MU: 12; 8; 5; 0',e:'MU = TU sau − TU trước: 12 − 0; 20 − 12; 25 − 20; 25 − 25. Cốc 4 có MU = 0 → TU lớn nhất, bắt đầu bão hòa.'},
 {cd:'CĐ3',k:'Trắc nghiệm',q:'MU = 0 có nghĩa là:',o:['Tổng lợi ích nhỏ nhất','Tổng lợi ích đạt cực đại','Khách hết thích sản phẩm','WTP tăng'],a:1,e:'Tiêu dùng thêm không làm tăng TU — điểm bão hòa.',w:['A ngược lại.','C: quy luật không có nghĩa là hết thích.','D: MU = 0 thì WTP cho đơn vị thêm bằng 0.']},
 {cd:'CĐ3',k:'Trắc nghiệm',q:'Khi MU âm thì:',o:['TU tăng chậm','TU giảm','TU không đổi','TU tăng nhanh'],a:1,e:'Đơn vị thêm làm giảm tổng lợi ích (cốc trà sữa thứ 7: TU 30 → 28).'},
 {cd:'CĐ3',k:'Trắc nghiệm',q:'Quy luật lợi ích cận biên giảm dần được xét chủ yếu trong:',o:['Nhiều năm sử dụng','Cùng thời điểm, giai đoạn ngắn','Khi thu nhập thay đổi','Khi sở thích thay đổi'],a:1,e:'Cô phân biệt: chán sản phẩm sau nhiều năm là do sở thích, hoàn cảnh, thu nhập thay đổi.',w:['C, D vi phạm giả định "các yếu tố khác không đổi".']},
 {cd:'CĐ3',k:'Trắc nghiệm',q:'Hàm ý quan trọng nhất của quy luật MU giảm dần với doanh nghiệp:',o:['Khách đã thích thì luôn mua thêm với cùng giá','Khách có thể sẵn lòng trả ít hơn cho phần mua thêm, dù vẫn thích sản phẩm','Phải luôn giảm giá đơn vị thứ hai','Khách sẽ ngừng mua sản phẩm'],a:1,e:'WTP đo lường lợi ích; lợi ích thêm giảm thì WTP cho đơn vị thêm giảm.',w:['A: đúng là điều cô bảo không được mặc nhiên.','C: quy luật không bắt buộc giảm giá.','D: hiểu sai thành hết thích.']},
 {cd:'CĐ3',k:'Trắc nghiệm',q:'Giá cà phê 40.000đ, khách định giá cốc thứ hai 60.000đ. Quán nên:',o:['Giảm giá cốc 2 ngay','Giữ giá, khách vẫn mua','Ngừng bán cốc 2','Bắt buộc mua combo'],a:1,e:'WTP (60.000đ) vẫn lớn hơn giá → khách vẫn có lợi khi mua.',w:['A: đúng là ý cô phản biện.','D: combo chỉ hiệu quả khi khách muốn món đi kèm.']},
 {cd:'CĐ3',k:'Trắc nghiệm',q:'Theo cô, trước khi giảm giá cho đơn vị mua thêm, thông tin nào KHÔNG cần thiết nhất?',o:['Mức sẵn lòng chi trả của khách','Khả năng thay thế bằng sản phẩm khác','Chi phí sản xuất của đơn vị thêm','Tổng lợi ích của đơn vị đầu tiên'],a:3,e:'Quyết định đơn vị thêm dựa vào lợi ích cận biên (WTP), hàng thay thế và chi phí; tổng lợi ích không phải biến quyết định.'},
 {cd:'CĐ3',k:'Trắc nghiệm',q:'Bán ly nhỏ / vừa / lớn với các mức giá khác nhau thuộc hướng vận dụng nào?',o:['Giá khuyến khích mua thêm','Phân khúc khách hàng và thiết kế quy cách sản phẩm','Phối hợp sản phẩm, gói tiêu dùng','Không liên quan quy luật MU'],a:1,e:'Khách khác nhau có MU của phần dung tích thêm khác nhau → thiết kế nhiều quy cách.'},

  let card='';
  if(!ids.length){ card=`<div class="empty"><h3>${qFilter==='ko'?'Không còn câu sai':'Chưa có câu'}</h3><p>Chọn "Tất cả" để ôn tiếp.</p></div>`; }
  else { const i=ids[qCur], q=Q[i], p=picks[i];
    card=`<div class="card stack"><div class="row"><span class="pill c">${q.cd}</span><span class="pill">${q.k}</span><span class="pill num">Câu ${i+1}/${Q.length}</span>${quizRes[i]==='ok'?'<span class="pill ok">Đã đúng</span>':quizRes[i]==='ko'?'<span class="pill ko">Cần ôn lại</span>':''}</div><div class="qtext">${q.q}</div>`;
    if(q.o){ card+=`<div class="opts">${q.o.map((o,j)=>{let c='';if(p!==undefined){if(j===q.a)c='right';else if(j===p)c='wrong';}return `<button class="opt ${c}" data-o="${j}" ${p!==undefined?'disabled':''}><span class="l">${LT[j]}</span><span>${o}</span></button>`}).join('')}</div>${p!==undefined?`<div class="explain"><b>${p===q.a?'Chính xác!':'Đáp án đúng: '+LT[q.a]}</b>${q.e}${q.w?`<ul class="why">${q.w.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</div>`:''}`; }
    else { card+= p===undefined?`<button class="btn ghost block" data-show="1">Tự làm ra giấy, rồi bấm xem đáp án</button>`:`<div class="explain"><b>Đáp án: ${q.ans}</b>${q.e}</div><div class="row"><span class="small muted" style="flex-basis:100%">Anh làm đúng không?</span><button class="btn good" style="flex:1" data-self="ok">Đúng</button><button class="btn bad" style="flex:1" data-self="ko">Chưa đúng</button></div>`; }
    card+=`<div class="qnav"><button class="btn ghost" data-nav="-1">← Câu trước</button><button class="btn" data-nav="1">Câu tiếp →</button></div></div>`; }
  v.innerHTML=`<div><div class="eyebrow">${S.name} · Ôn tập</div><h1 style="margin-top:4px">Ngân hàng câu hỏi</h1></div>
  <div class="card flat stat num"><div><b>${vals.length}</b><small>đã làm</small></div><div><b style="color:var(--good)">${ok}</b><small>đúng</small></div><div><b style="color:var(--bad)">${ko}</b><small>cần ôn lại</small></div></div>
  <div class="chips">${['all',...cds,'ko'].map(f=>`<button class="chip ${qFilter===f?'on':''}" data-f="${f}">${f==='all'?'Tất cả':f==='ko'?'Câu sai':f}</button>`).join('')}<button class="chip" data-reset="1">Làm lại từ đầu</button></div>
  ${ids.length?`<div class="dots">${ids.map((i,j)=>`<button class="${j===qCur?'cur ':''}${quizRes[i]||''}" data-j="${j}" aria-label="Câu ${i+1}">${i+1}</button>`).join('')}</div>`:''}
  ${card}`;
}


/* ---------- Ask link ---------- */
function plain(h){ const d=document.createElement('div'); d.innerHTML=h; return d.textContent.replace(/\s+/g,' ').trim(); }
function askLink(s,ch,i){ const S=SUBJ[s], t=ch.topics[i]; const body=plain(t.b); const brief=body.length>500?body.slice(0,500)+'…':body;
  const q=`Môn ${S.name} (EMBA), Chuyên đề ${ch.n}: ${ch.title}, chủ đề "${t.t}".\n\nNội dung tôi đang học:\n${brief}\n\nHãy giải thích kỹ hơn phần này giúp tôi, kèm ví dụ dễ hiểu.`;
  return 'https://claude.ai/new?q='+encodeURIComponent(q); }


/* ---------- Fullscreen ---------- */
(function(){
  const root=document.documentElement, b=$('fsBtn'), ico=$('fsIco');
  const req=root.requestFullscreen||root.webkitRequestFullscreen, ex=document.exitFullscreen||document.webkitExitFullscreen;
  const enabled=(document.fullscreenEnabled||document.webkitFullscreenEnabled)&&req;
  if(!enabled) return;               // ví dụ Safari trên iPhone: không hỗ trợ, ẩn nút
  b.hidden=false;
  const isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  const paint=()=>{ const on=isFs(); b.setAttribute('aria-label',on?'Thoát toàn màn hình':'Toàn màn hình'); b.title=b.getAttribute('aria-label'); b.classList.toggle('on',on);
    ico.innerHTML=on?'<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>':'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>'; };
  const go=async()=>{ try{ await req.call(root,{navigationUI:'hide'}); }catch(e){} paint(); };
  const leave=async()=>{ try{ await ex.call(document); }catch(e){} paint(); };
  b.addEventListener('click',e=>{ e.stopPropagation(); if(isFs()){ store.set('emba-fs',false); leave(); } else { store.set('emba-fs',true); go(); } });
  document.addEventListener('fullscreenchange',paint); document.addEventListener('webkitfullscreenchange',paint);
  // Mặc định toàn màn hình: trình duyệt chỉ cho phép sau một lần chạm, nên bật ở lần chạm đầu tiên
  const auto=(e)=>{ if(e.target.closest&&e.target.closest('#fsBtn')) return; if(store.get('emba-fs',true) && !isFs()) go(); };
  document.addEventListener('pointerdown',auto,{once:true,capture:true});
  paint();
})();

/* ===================== EVENTS ===================== */
document.addEventListener('click',e=>{
  const mo=e.target.closest('[data-more]'); if(mo){ const box=$('m-'+mo.dataset.more); const open=box.hidden; box.hidden=!open; mo.textContent=open?'Less':'More'; mo.setAttribute('aria-expanded',String(open)); mo.classList.toggle('on',open); return; }
  const u=e.target.closest('[data-u]'); if(u){ const v=!understood[u.dataset.u]; understood[u.dataset.u]=v; store.set('emba-understood',understood); u.classList.toggle('on',v); u.textContent=v?'✓ Got it':'Got it'; u.setAttribute('aria-pressed',String(v)); const tc=document.querySelector(`.toc a[data-jump="t${u.dataset.ti}"]`); if(tc) tc.classList.toggle('ok',v); return; }
  const jp=e.target.closest('[data-jump]'); if(jp){ e.preventDefault(); const t=$(jp.dataset.jump); if(t) t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); return; }
  const bt=e.target.closest('.bottom a'); if(bt){ e.preventDefault(); location.hash=`#${cur}-${bt.dataset.tab}`; return; }
  const v=$('v-quiz'); if(!v.contains(e.target)) return;
  const Q=SUBJ[cur].quiz, ids=qList(Q), i=ids[qCur];
  const o=e.target.closest('[data-o]'); if(o&&picks[i]===undefined){ const j=+o.dataset.o; picks[i]=j; quizRes[i]=j===Q[i].a?'ok':'ko'; store.set('emba-quiz',quizRes); renderQuiz(cur); return; }
  if(e.target.closest('[data-show]')){ picks[i]=-1; renderQuiz(cur); return; }
  const sf=e.target.closest('[data-self]'); if(sf){ quizRes[i]=sf.dataset.self; store.set('emba-quiz',quizRes); qCur=Math.min(qCur+1,ids.length-1); renderQuiz(cur); return; }
  const n=e.target.closest('[data-nav]'); if(n){ qCur=(qCur+ +n.dataset.nav+ids.length)%ids.length; renderQuiz(cur); return; }
  const dj=e.target.closest('[data-j]'); if(dj){ qCur=+dj.dataset.j; renderQuiz(cur); return; }
  const f=e.target.closest('[data-f]'); if(f){ qFilter=f.dataset.f; qCur=0; renderQuiz(cur); return; }
  if(e.target.closest('[data-reset]')){ quizRes={}; picks={}; store.set('emba-quiz',quizRes); qCur=0; renderQuiz(cur); }
});
document.addEventListener('change',e=>{ const t=e.target.closest('[data-td]'); if(t){ todoDone[t.dataset.td]=t.checked; store.set('emba-todo',todoDone); } });
$('subj').addEventListener('change',e=>{ const s=e.target.value; if(s) location.hash=`#${s}-know`; else location.hash='#home'; });

/* ===================== ROUTER ===================== */
function show(id){ document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+id)); }
function route(){
  const h=(location.hash||'').slice(1); const m=h.match(/^(ktud|qtcl)-([a-z0-9]+)$/);
  const pk=$('picker'), sel=$('subj');
  document.querySelectorAll('.bottom a').forEach(a=>a.classList.remove('on'));
  if(!m){ document.body.classList.add('home-mode'); $('homeBtn').classList.add('on'); sel.value=''; pk.className='picker nosubj'; renderHome(); show('home'); return; }
  const [,s,p]=m; if(s!==cur){ cur=s; qFilter='all'; qCur=0; picks={}; } store.set('emba-subj',s); setSubjColors(s);
  document.body.classList.remove('home-mode'); $('homeBtn').classList.remove('on'); sel.value=s; pk.className='picker active';
  let tab='know';
  if(p==='know'){ renderKnow(s); show('know'); }
  else if(p==='work'){ renderWork(s); show('work'); tab='work'; }
  else if(p==='quiz'){ renderQuiz(s); show('quiz'); tab='quiz'; }
  else { renderChap(s,p); show('chap'); }
  document.querySelector(`.bottom a[data-tab="${tab}"]`).classList.add('on');
}
let lastHash=null;
window.addEventListener('hashchange',()=>{ route(); if(location.hash!==lastHash) window.scrollTo(0,0); lastHash=location.hash; });
setSubjColors(cur); route(); lastHash=location.hash;
})();
</script>
