<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7A75">
<title>Sổ tay EMBA 6XD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: mobile-first, một cột như ứng dụng học; mỗi môn một "màu nhiên liệu"; lộ trình kiến thức như tuyến đường có các trạm dừng. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEA; --ink:#13201D; --muted:#5B6B66; --line:#D6DED9;
  --ktud:#0B7A75; --ktud-soft:#D6EEEC; --qtcl:#D9562B; --qtcl-soft:#FBE3D9; --gold:#E8A317; --gold-soft:#FCEFCF; --gold-ink:#8A5D00;
  --good:#1F8F4E; --good-soft:#DDF2E4; --bad:#C8372D; --bad-soft:#F8DEDB; --violet:#5A6FD6; --violet-soft:#E3E7FA;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --c:var(--ktud); --cs:var(--ktud-soft);
  --shadow:0 1px 2px rgba(19,32,29,.06),0 6px 18px rgba(19,32,29,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1614; --surface:#16211E; --surface-2:#1F2C29; --ink:#E7EFEC; --muted:#94A7A1; --line:#2B3A36;
  --ktud:#3BBDB4; --ktud-soft:#17332F; --qtcl:#F2825C; --qtcl-soft:#3A2219; --gold:#F2B940; --gold-soft:#3A2F14; --gold-ink:#F2B940;
  --good:#4CC27D; --good-soft:#163222; --bad:#F0675C; --bad-soft:#3A1A17; --violet:#8C9BF0; --violet-soft:#232845;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#16211E; --surface-2:#1F2C29; --ink:#E7EFEC; --muted:#94A7A1; --line:#2B3A36;
  --ktud:#3BBDB4; --ktud-soft:#17332F; --qtcl:#F2825C; --qtcl-soft:#3A2219; --gold:#F2B940; --gold-soft:#3A2F14; --gold-ink:#F2B940;
  --good:#4CC27D; --good-soft:#163222; --bad:#F0675C; --bad-soft:#3A1A17; --violet:#8C9BF0; --violet-soft:#232845;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.6 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.home-mode{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
h1,h2,h3,h4{font-family:var(--display);line-height:1.18;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:27px;font-weight:800} h2{font-size:21px;font-weight:800} h3{font-size:17.5px;font-weight:600} h4{font-size:15.5px;font-weight:600}
p{margin:0} a{color:var(--c)} button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}

/* Top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left));background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.homebtn{flex:none;width:44px;height:44px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.homebtn.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.homebtn svg{width:22px;height:22px}
.picker{position:relative;flex:1;min-width:0}
.picker select{appearance:none;-webkit-appearance:none;width:100%;height:44px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);padding:0 38px 0 38px;font-weight:700;font-size:15px;text-overflow:ellipsis}
.picker.active select{border-color:var(--c);background:var(--cs);color:var(--c)}
.picker .dot{position:absolute;left:14px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:4px;background:var(--c);pointer-events:none}
.picker.nosubj .dot{background:var(--muted)}
.picker .chev{position:absolute;right:14px;top:50%;margin-top:-8px;width:16px;height:16px;pointer-events:none;color:var(--muted)}
.days{flex:none;font-size:12.5px;font-weight:800;padding:6px 10px;border-radius:99px;background:var(--gold-soft);color:var(--gold-ink);white-space:nowrap}

/* Bottom bar */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(19,32,29,.08);padding:6px calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}
.bottom .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border-radius:14px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:700}
.bottom a svg{width:23px;height:23px}
.bottom a.on{background:var(--cs);color:var(--c)}
body.home-mode .bottom{display:none}

main{max-width:760px;margin:0 auto;padding:16px calc(16px + env(safe-area-inset-right)) 28px calc(16px + env(safe-area-inset-left))}
.view{display:none;flex-direction:column;gap:14px} .view.on{display:flex}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--c)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.pill.c{background:var(--cs);color:var(--c)} .pill.g{background:var(--gold-soft);color:var(--gold-ink)} .pill.ok{background:var(--good-soft);color:var(--good)} .pill.ko{background:var(--bad-soft);color:var(--bad)}
.btn{border:0;border-radius:13px;padding:12px 16px;min-height:46px;font-weight:700;font-size:14.5px;background:var(--c);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--surface-2);color:var(--ink)} .btn.good{background:var(--good)} .btn.bad{background:var(--bad)} .btn.block{width:100%}
ul.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.note{border-left:4px solid var(--nc,var(--gold));background:var(--ncs,var(--gold-soft));padding:12px 14px;border-radius:0 12px 12px 0;font-size:14.5px}
.formula{font-family:var(--display);font-size:15.5px;font-weight:600;background:var(--surface-2);border-radius:12px;padding:12px 14px;text-align:center}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.li:last-child{border-bottom:0}
.li .d{flex:none;width:52px;text-align:center;border-radius:12px;padding:5px 0;background:var(--surface-2)}
.li .d b{display:block;font:800 18px var(--display);line-height:1.1}
.li .d small{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase}
.li .t{flex:1;min-width:0}
.li .t b{display:block}
.tag{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
svg text{font-family:var(--body)}

/* Home hero */
.hero{border-radius:22px;padding:20px;color:#fff;background:linear-gradient(140deg,#0B7A75 0%,#0A5753 55%,#3C2A1F 100%);position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;border:30px solid rgba(255,255,255,.07)}
.hero .eyebrow{color:#fff;opacity:.8}
.hero h1{color:#fff;font-size:24px;margin-top:4px}
.hero p{opacity:.9;font-size:14px;margin-top:6px}
.gauge{width:118px;position:relative;z-index:1}

/* Roadmap */
.road{position:relative;display:flex;flex-direction:column;gap:12px;padding-left:34px}
.road::before{content:"";position:absolute;left:14px;top:18px;bottom:18px;width:4px;border-radius:4px;background:repeating-linear-gradient(to bottom,var(--line) 0 10px,transparent 10px 18px)}
.stop{position:relative;display:block;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink)}
.stop::before{content:attr(data-n);position:absolute;left:-34px;top:14px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:800 13px var(--display);background:var(--surface);border:3px solid var(--line);color:var(--muted)}
.stop.done::before{background:var(--c);border-color:var(--c);color:#fff}
.stop.now::before{background:var(--gold);border-color:var(--gold);color:#3D2A00;box-shadow:0 0 0 5px var(--gold-soft)}
.stop.soon{opacity:.62;box-shadow:none;background:transparent;border-style:dashed}
.stop h3{margin:4px 0 4px}
.bar{height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--c);border-radius:9px}

/* Chapter */
.back{align-self:flex-start;border:0;background:none;padding:6px 0;font-weight:700;color:var(--c);display:flex;gap:6px;align-items:center;text-decoration:none}
.chhead{border-radius:20px;padding:18px;background:var(--cs);display:flex;flex-direction:column;gap:6px}
.toc{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.toc a{flex:none;font-size:13px;font-weight:700;padding:7px 12px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);text-decoration:none;color:var(--ink);white-space:nowrap}
.toc a.ok{border-color:var(--c);color:var(--c)}
.topic{scroll-margin-top:76px}
.topic .hd{display:flex;gap:12px;align-items:flex-start}
.topic .n{flex:none;width:34px;height:34px;border-radius:11px;background:var(--c);color:#fff;font:800 14px var(--display);display:grid;place-items:center}
.topic .src{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.topic .body{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.more-box{border:1.5px dashed var(--gold);border-radius:14px;background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.more-box[hidden]{display:none}
.mtag{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:#3D2A00;padding:2px 8px;border-radius:6px}
.act{flex:1;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:40px;padding:6px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:13.5px;text-decoration:none;cursor:pointer}
.act[data-more]{border-color:var(--gold);color:var(--gold-ink);background:var(--gold-soft)}
.act.ask{border-color:var(--c);color:var(--c)}
.act.got.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.acts{display:flex;gap:8px}
.understood.ask{color:var(--c);border-color:var(--c)}
.sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(10,20,18,.45)}
.sheet.on{display:flex}
.sheet .box{width:100%;max-width:640px;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.sheet textarea{width:100%;min-height:120px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;font-size:15px;padding:12px;resize:vertical}
.sheet .row .btn{flex:1}
.mh{font:800 11.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink);margin-top:4px}
.mh:first-child{margin-top:0}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.steps li::marker{font-weight:800;color:var(--c)}
.why{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.intro{font-size:15px;line-height:1.65}
.understood{align-self:flex-start;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13.5px;min-height:40px}
.understood.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.summary{border-radius:20px;padding:18px;background:var(--ink);color:var(--surface);display:flex;flex-direction:column;gap:12px}
.summary h2{color:var(--surface)}
.summary .k{display:grid;gap:8px}
.summary .k div{background:color-mix(in srgb,var(--surface) 10%,transparent);border-radius:12px;padding:10px 12px;font-size:14.5px}
.summary .k b{color:var(--gold)}
.summary .lab{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.summary ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.terms{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.term{background:color-mix(in srgb,var(--surface) 10%,transparent);border-radius:10px;padding:7px 10px;font-size:13px}
.term i{display:block;opacity:.75}
.pillars{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl{border-radius:14px;padding:12px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--pc)}
.pl b{font:800 20px var(--display);color:var(--pc);display:block;line-height:1}
.pl h4{margin:6px 0 2px}
.pl p{font-size:13px;color:var(--muted)}

/* Exercises */
details.sol{border-radius:12px;background:var(--surface-2)}
details.sol summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:700;font-size:14px;color:var(--c);min-height:44px;display:flex;align-items:center}
details.sol summary::-webkit-details-marker{display:none}
details.sol[open] summary{border-bottom:1px solid var(--line)}
details.sol .in{padding:12px 14px;font-size:14.5px}
.todo{display:flex;flex-direction:column;gap:6px}
.todo label{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2);font-size:15px;cursor:pointer}
.todo input{margin-top:2px;accent-color:var(--c);width:20px;height:20px;flex:none}
.todo input:checked + span{text-decoration:line-through;color:var(--muted)}

/* Quiz */
.stat{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stat b{font:800 24px var(--display);display:block}
.stat small{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:99px;font-weight:700;font-size:13.5px;min-height:40px}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.dots{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.dots::-webkit-scrollbar{display:none}
.dots button{flex:none;width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:800;padding:0}
.dots .cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dots .ok{background:var(--good);border-color:var(--good);color:#fff} .dots .ko{background:var(--bad);border-color:var(--bad);color:#fff}
.qtext{font:600 17px/1.5 var(--body)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 14px;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:15.5px}
.opt .l{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface-2);font:800 13px var(--display);display:grid;place-items:center}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .l{background:var(--bad);color:#fff}
.explain{border-radius:14px;padding:12px 14px;background:var(--surface-2);font-size:14.5px}
.explain b{display:block;margin-bottom:4px}
.qnav{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:sticky;bottom:calc(78px + env(safe-area-inset-bottom));background:var(--surface);padding-top:6px}
.empty{text-align:center;padding:30px 16px;border:1.5px dashed var(--line);border-radius:18px;color:var(--muted);display:flex;flex-direction:column;gap:6px}

/* Timeline */
.tl{display:flex;flex-direction:column;gap:8px}
.tl-axis{position:relative;height:16px;font-size:11px;color:var(--muted)}
.tl-axis span{position:absolute;transform:translateX(-50%)}
.tl-axis span:first-child{transform:none}
.tl-axis span:last-child{transform:translateX(-100%)}
.tl-row{font-size:13px}
.tl-track{position:relative;height:22px;border-radius:6px;background:var(--surface-2);margin-top:3px}
.tl-bar{position:absolute;top:3px;height:16px;border-radius:99px}
.tl-dot{position:absolute;top:2px;width:18px;height:18px;transform:translateX(-50%) rotate(45deg);border-radius:4px}
.tl-today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}

@media (min-width: 700px){ h1{font-size:32px} .hero h1{font-size:30px} .gauge{width:150px} .pillars{grid-template-columns:repeat(4,1fr)} .terms{grid-template-columns:repeat(3,1fr)} }
@media (prefers-reduced-motion: no-preference){ .view.on{animation:rise .3s ease both} @keyframes rise{from{opacity:.5;transform:translateY(6px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<header class="top">
  <a class="homebtn" href="#home" id="homeBtn" aria-label="Trang chủ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></a>
  <div class="picker nosubj" id="picker">
    <span class="dot"></span>
    <label for="subj" class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Chọn môn học</label>
    <select id="subj">
      <option value="">Chọn môn học…</option>
      <option value="ktud">Kinh tế ứng dụng</option>
      <option value="qtcl">Quản trị chiến lược</option>
    </select>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
  </div>
  <span class="days" id="days">30 ngày</span>
  <button class="homebtn" id="fsBtn" aria-label="Toàn màn hình" title="Toàn màn hình" hidden><svg id="fsIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</header>

<main>
  <section class="view" id="v-home"></section>
  <section class="view" id="v-know"></section>
  <section class="view" id="v-chap"></section>
  <section class="view" id="v-work"></section>
  <section class="view" id="v-quiz"></section>

SUBJ.ktud.chapters=[
{id:'cd1',n:1,title:'Một số nguyên lý cơ bản của kinh tế học',sub:'Khan hiếm buộc phải lựa chọn: 4 nguyên lý ra quyết định',status:'done',src:'Slide giảng viên',
 intro:'Chuyên đề này trả lời một câu hỏi nền tảng của quản trị: khi tiền, người, thời gian đều có hạn thì dựa vào đâu để chọn phương án này mà bỏ phương án kia? Cô đưa ra 4 nguyên lý, mỗi nguyên lý là một "câu hỏi kiểm tra" nhà quản trị nên tự đặt ra trước khi ra quyết định.',
 topics:[
 {t:'Khan hiếm và kinh tế học',
  b:`<p><b>Khan hiếm (scarcity)</b> nghĩa là có ít nguồn lực hơn mức cần thiết để đáp ứng nhu cầu của con người. Slide nêu ví dụ: năm 2020 có 155 triệu người bị đói trên thế giới.</p>
<p><b>Nguồn lực sản xuất</b> (còn gọi là yếu tố sản xuất) là tất cả những gì dùng để làm ra hàng hóa, dịch vụ: tài nguyên thiên nhiên, lao động, vốn…</p>
<p>Vì sao khan hiếm? Vì <b>số lượng nguồn lực là hữu hạn</b>, trong khi <b>nhu cầu về hàng hóa, dịch vụ là vô hạn</b>. Do đó con người luôn phải lựa chọn. Cô đưa ra nhiều ví dụ lựa chọn ở mọi cấp:</p>
<ul class="clean"><li>Cá nhân: dùng 500 triệu mua ô tô hay đầu tư chứng khoán? Dùng 15 giờ cuối tuần học EMBA hay nhận thêm dự án tư vấn?</li><li>Doanh nghiệp: dùng 50 tỷ mở rộng nhà máy hay chuyển đổi số? Dùng dây chuyền sản xuất xe SUV hay xe điện?</li><li>Chính phủ: 10.000 tỷ ngân sách xây cao tốc hay bệnh viện? Địa phương dùng quỹ đất ven biển làm du lịch hay cảng công nghiệp?</li></ul>
<p><b>Kinh tế học</b> là môn khoa học nghiên cứu cách mỗi cá nhân, tổ chức và xã hội lựa chọn sử dụng nguồn lực khan hiếm của họ. Có hai phân ngành:</p>
<ul class="clean"><li><b>Kinh tế học vi mô</b>: nghiên cứu hành vi kinh tế của các tác nhân đơn lẻ (một người tiêu dùng, một doanh nghiệp, một thị trường).</li><li><b>Kinh tế học vĩ mô</b>: nghiên cứu các vấn đề kinh tế tổng hợp của cả nền kinh tế (lạm phát, tăng trưởng, thất nghiệp).</li></ul>
<p>Từ đó cô giới thiệu <b>4 nguyên lý về cách con người ra quyết định</b>: (1) con người đối mặt với sự đánh đổi; (2) chi phí của một thứ là những gì phải từ bỏ để có nó; (3) con người hợp lý suy nghĩ tại điểm cận biên; (4) con người phản ứng với các động cơ khuyến khích.</p>`,
  m:`<div class="mh">Hiểu đơn giản</div><p>Kinh tế học không phải môn "học về tiền". Nó là môn học về <b>cách chọn khi không thể có tất cả</b>. Nếu nguồn lực vô hạn thì không cần kinh tế học — cứ làm hết mọi dự án.</p>
<div class="mh">Vi mô hay vĩ mô?</div><p>Môn học này chủ yếu là <b>vi mô</b> (CĐ1–4: người tiêu dùng, doanh nghiệp, thị trường). Chỉ CĐ5 là vĩ mô. Mẹo phân biệt: câu hỏi về "một cửa hàng, một công ty, giá xăng" là vi mô; câu hỏi về "lạm phát cả nước, GDP, lãi suất điều hành" là vĩ mô.</p>
<div class="mh">Nguồn gốc</div><p>Bốn nguyên lý này là nhóm đầu trong "10 nguyên lý kinh tế học" của N. Gregory Mankiw (giáo trình <i>Principles of Economics</i>, bản tiếng Việt <i>Nguyên lý kinh tế học</i>). Sáu nguyên lý còn lại nói về trao đổi, thị trường, vai trò Nhà nước, năng suất, lạm phát — sẽ gặp lại ở CĐ2 và CĐ5.</p>`},
 {t:'Nguyên lý 1 · Con người đối mặt với sự đánh đổi',
  b:`<p><b>Tình huống:</b> Doanh nghiệp X có 50 tỷ đồng đầu tư, chỉ đủ ưu tiên <b>một</b> hướng lớn:</p>
<div class="scroll"><table class="tbl"><thead><tr><th>Phương án</th><th>Được gì</th><th>Phải đổi lấy gì</th></tr></thead><tbody>
<tr><td><b>A. Mở rộng công suất</b></td><td>Khai thác nhu cầu thị trường trước mắt</td><td>Giảm nguồn lực cho đổi mới, số hóa</td></tr>
<tr><td><b>B. Phát triển sản phẩm</b></td><td>Tạo dư địa tăng trưởng tương lai, lợi thế cạnh tranh lâu dài</td><td>Chậm mở rộng năng lực cung ứng</td></tr>
<tr><td><b>C. Chuyển đổi số</b></td><td>Nâng năng suất, giảm chi phí vận hành</td><td>Trì hoãn đầu tư sản xuất, sản phẩm</td></tr></tbody></table></div>
<p><b>Nguyên lý:</b> nguồn lực có hạn buộc cá nhân và tổ chức phải lựa chọn giữa các cách sử dụng khác nhau. Chuỗi logic: <b>Khan hiếm</b> (nguồn lực có giới hạn) → <b>Lựa chọn</b> (quyết định ưu tiên) → <b>Đánh đổi</b> (hy sinh lợi ích khác). Cô lưu ý: <i>đánh đổi không có nghĩa là mọi mục tiêu luôn xung đột.</i></p>
<p><b>Các cặp đánh đổi điển hình trong quản trị:</b></p>
<ul class="clean"><li>Tăng trưởng ngắn hạn ↔ đầu tư dài hạn (doanh thu hôm nay ↔ năng lực cạnh tranh mai sau)</li><li>Giảm chi phí ↔ nâng chất lượng (tiết kiệm nguồn lực ↔ giá trị cung cấp)</li><li>Tốc độ triển khai ↔ mức độ kiểm soát (ra thị trường nhanh ↔ kiểm thử, kiểm soát rủi ro)</li></ul>
<p><b>Tư duy lựa chọn — 4 câu hỏi trước khi phân bổ nguồn lực:</b></p>
<ol class="clean"><li>Mục tiêu ưu tiên là gì? (kết quả chiến lược quan trọng nhất)</li><li>Nguồn lực nào đang giới hạn? (ngân sách, nhân lực, thời gian, năng lực)</li><li>Được gì và phải hy sinh gì?</li><li>Phương án nào phù hợp nhất với chiến lược và điều kiện hiện tại?</li></ol>
<p><b>Quay lại quyết định 50 tỷ</b> — không có lựa chọn tối ưu giống nhau cho mọi doanh nghiệp: ưu tiên công suất khi thiếu khả năng đáp ứng đơn hàng và nhu cầu tăng mạnh; ưu tiên sản phẩm khi sản phẩm hiện có có nguy cơ mất lợi thế; ưu tiên chuyển đổi số khi chi phí vận hành cao, quy trình thiếu hiệu quả.</p>
<p><b>Thời gian</b> là nguồn lực khan hiếm nhất: khác với tiền, nó không thể tích trữ, vay mượn hay hoàn lại. Khi nói "có" với một việc, ta đang nói "không" với vô số việc khác.</p>
<p><b>Ba thông điệp quản trị:</b> quản trị là lựa chọn (không chỉ quyết định làm gì mà cả việc <i>chưa</i> làm); ưu tiên theo chiến lược, tránh dàn trải; nhận diện đánh đổi nhiều chiều trước khi quyết định.</p>`,
  m:`<div class="mh">Hiểu đơn giản</div><p>Đánh đổi giống như <b>bài toán tối ưu có ràng buộc</b>: muốn nhiều thứ nhưng chỉ có một ngân sách, một quỹ thời gian. Không có lời giải "tốt nhất tuyệt đối", chỉ có lời giải tốt nhất <b>trong điều kiện ràng buộc cụ thể</b>. Vì vậy cùng 50 tỷ, mỗi doanh nghiệp lại chọn khác nhau.</p>
<div class="mh">Ví dụ thêm</div><p>Hãng hàng không giá rẻ chọn chi phí thấp, đổi lại phải hy sinh dịch vụ kèm theo (suất ăn, hành lý miễn phí). Hãng hàng không truyền thống chọn ngược lại. Cả hai đều hợp lý, vì phục vụ hai nhóm khách khác nhau — đúng ý "không có lựa chọn tối ưu chung".</p><div class="mh">"Đánh đổi không có nghĩa luôn xung đột" — hiểu thế nào?</div><p>Có những phương án làm được nhiều mục tiêu cùng lúc. Ví dụ chuyển đổi số vừa giảm chi phí giấy tờ, vừa tăng khả năng kiểm soát. Nhưng ngay cả khi đó vẫn có đánh đổi: tiền và người đã dồn cho chuyển đổi số thì không dùng cho việc khác được.</p>
<div class="mh">Lỗi hay mắc khi trả lời tự luận</div><ul class="clean"><li>Chỉ nói "được gì" mà quên "mất gì". Bài làm tốt phải nêu cả cột "phải đổi lấy gì".</li><li>Kết luận một phương án là "tốt nhất" mà không gắn với bối cảnh. Hãy dùng mẫu câu của cô: "ưu tiên A <i>khi</i>…".</li></ul>
`},
 {t:'Nguyên lý 2 · Chi phí cơ hội',
  b:`<p><b>Câu hỏi mở đầu của cô:</b> một dự án có lợi nhuận vẫn có thể <i>không</i> đáng lựa chọn?</p>
<p><b>Tình huống:</b> Doanh nghiệp X có mặt bằng đang bỏ trống. Phương án A: mở trung tâm đào tạo. Phương án B: cho doanh nghiệp khác thuê. Số liệu mỗi năm (tỷ đồng): doanh thu trung tâm 5,0; chi phí kế toán 3,8; lợi nhuận kế toán 1,2; tiền thuê có thể nhận nếu không mở trung tâm 1,5.</p>
<p><b>Nhận diện chi phí thực sự:</b> một khoản không phải trả tiền vẫn có thể là chi phí kinh tế.</p>
<ul class="clean"><li><b>Chi phí hiện</b> (explicit cost): khoản chi trực tiếp — nhân sự, vật tư, điện nước, marketing…</li><li><b>Chi phí ẩn</b> (implicit cost): giá trị nguồn lực tự có phải từ bỏ — ở đây là tiền thuê mặt bằng có thể thu.</li></ul>
<p class="formula">Không chi tiền ≠ Không có chi phí cơ hội</p>
<p><b>Định nghĩa:</b> chi phí của một thứ là những gì phải từ bỏ để có được nó. <b>Chi phí cơ hội = giá trị của phương án thay thế tốt nhất bị từ bỏ.</b> Không cộng giá trị của tất cả phương án không được chọn.</p>
<p><b>Thực hành 1 — kho tự sở hữu:</b> công ty dùng kho của mình làm trung tâm phân phối. Chi phí vận hành kho 400 triệu/năm; nếu cho thuê kho thì thu được 600 triệu/năm. → Chi phí kinh tế = 400 (hiện) + 600 (ẩn) = <b>1.000 triệu/năm</b>.</p>
<p><b>Thực hành 2 — khu đất ba phương án</b> (lợi ích ròng, cùng kỳ, cùng rủi ro): A cho thuê 900 triệu/năm; B bãi đỗ xe 1,1 tỷ/năm; C quảng cáo 800 triệu/năm. Nếu chọn A thì chi phí cơ hội là <b>1,1 tỷ (phương án B)</b> — chọn A kém hơn 200 triệu/năm. Không cộng B và C.</p>
<p><b>Quay lại trung tâm đào tạo:</b></p>
<div class="formula">LN kế toán = 5,0 − 3,8 = +1,2 tỷ<br>LN kinh tế = 5,0 − 3,8 − 1,5 = −0,3 tỷ</div>
<p>Có lãi kế toán nhưng thấp hơn phương án cho thuê (với giả định không có lợi ích khác, số liệu đủ, rủi ro tương đương).</p>
<p><b>Ra quyết định — đừng chỉ nhìn lợi nhuận:</b> câu hỏi kế toán là "phương án này có tạo ra lợi nhuận không?"; câu hỏi kinh tế là "phương án này có tốt hơn cách dùng nguồn lực khác không?". Hiệu quả kinh tế đòi hỏi so sánh với lựa chọn thay thế.</p>`,
  m:`<div class="mh">Hiểu đơn giản</div><p>Kế toán ghi lại <b>những gì đã chi ra</b>. Kinh tế học hỏi thêm: <b>những gì mình đã bỏ lỡ</b>. Mặt bằng "của nhà" không tốn tiền thuê, nhưng nếu đem cho người khác thuê thì được 1,5 tỷ. Dùng nó để mở trung tâm nghĩa là "trả" 1,5 tỷ đó cho chính mình — chỉ là không có hóa đơn.</p>
<div class="mh">Vì sao chỉ lấy phương án tốt nhất, không cộng tất cả?</div><p>Vì mỗi lúc chỉ làm được <b>một</b> phương án trên cùng khu đất. Nếu không chọn A, ta chỉ làm được B <i>hoặc</i> C, không thể vừa B vừa C. Cái thực sự mất khi chọn A là phương án tốt nhất trong số còn lại (B = 1,1 tỷ). Cộng B + C = 1,9 tỷ là đếm một thứ không bao giờ có được.</p>
<div class="mh">Cách tính từng bước (áp dụng mọi bài)</div><ol class="clean"><li>Liệt kê doanh thu của phương án đang xét.</li><li>Liệt kê chi phí hiện (có chứng từ).</li><li>Hỏi: nguồn lực nào của mình đang được dùng mà không trả tiền? (đất, nhà, vốn tự có, thời gian của chủ). Mỗi thứ, nếu không dùng ở đây thì đem đi đâu được bao nhiêu? → đó là chi phí ẩn.</li><li>LN kinh tế = Doanh thu − chi phí hiện − chi phí ẩn. Dương thì phương án tốt hơn cách dùng thay thế; âm thì kém hơn.</li></ol>
<div class="mh">Ví dụ thêm</div><p>Một chủ nhà mặt phố tự mở quán cà phê ở tầng 1, lãi kế toán 300 triệu/năm. Nếu cho một chuỗi cửa hàng thuê mặt bằng đó được 400 triệu/năm thì LN kinh tế của quán là −100 triệu: tự kinh doanh đang kém phương án cho thuê. Nhiều người không nhận ra vì "nhà mình thì không mất tiền thuê".</p><div class="mh">Lỗi hay mắc</div><ul class="clean"><li>Quên chi phí ẩn khi tài sản là "của mình".</li><li>Cộng tất cả phương án bị bỏ thay vì chỉ lấy phương án tốt nhất.</li><li>So sánh các phương án khác kỳ hạn hoặc khác rủi ro mà không nói rõ giả định (slide luôn ghi "cùng kỳ, cùng rủi ro").</li></ul>`},
 {t:'Chi phí chìm',
  b:`<p><b>Tình huống — phát triển sản phẩm mới:</b> đã chi 8 tỷ (không thu hồi được); cần chi thêm 3 tỷ để hoàn thành; thu dự kiến trong tương lai 2 tỷ. Có nên chi thêm 3 tỷ để "cứu" 8 tỷ đã bỏ ra?</p>
<p><b>Chi phí chìm (sunk cost):</b> khoản đã chi, không thể thu hồi và <b>không đổi theo quyết định hiện tại</b>. Quyết định lúc này: chi thêm 3 tỷ nhưng chỉ thu 2 tỷ → nên dừng. Không quyết định theo số tiền đã mất; chỉ xét phần thay đổi từ nay.</p>
<p><b>Thực hành 3:</b> dự án đã chi 5 tỷ, không thu hồi được.</p>
<div class="scroll"><table class="tbl num"><thead><tr><th>Tình huống</th><th>Chi thêm</th><th>Thu về</th><th>Lợi ích tăng thêm</th><th>Quyết định</th></tr></thead><tbody><tr><td>A</td><td>2 tỷ</td><td>3 tỷ</td><td>+1 tỷ</td><td><b>Tiếp tục</b></td></tr><tr><td>B</td><td>2 tỷ</td><td>1,5 tỷ</td><td>−0,5 tỷ</td><td><b>Dừng</b></td></tr></tbody></table></div>
<p>Khoản 5 tỷ đã chi không thay đổi giữa hai quyết định, nên không ảnh hưởng tới lựa chọn.</p>
<p><b>Ba nguyên tắc tránh đánh giá sai phương án:</b> (1) nhìn đủ chi phí — tính cả giá trị nguồn lực tự có và cơ hội bị từ bỏ; (2) so sánh đúng phương án — đối chiếu với lựa chọn thay thế tốt nhất; (3) tránh bẫy chi phí chìm — tiếp tục hay dừng theo lợi ích và chi phí còn thay đổi.</p>
<p><b>Câu hỏi liên hệ của cô:</b> doanh nghiệp anh/chị có đang dùng nguồn lực "miễn phí" nào mà thực tế phải từ bỏ cơ hội sinh lợi khác? Có dự án nào vẫn tiếp tục chủ yếu vì đã đầu tư quá nhiều?</p>`,
  m:`<div class="mh">Hiểu đơn giản</div><p>Hãy tưởng tượng đứng ở thời điểm hôm nay và hỏi: "Từ giờ trở đi, nếu đi tiếp thì <b>thêm</b> bao nhiêu tiền ra, <b>thêm</b> bao nhiêu tiền vào?". Tiền đã chi nằm ở cả hai kịch bản (đi tiếp hay dừng đều đã mất), nên nó triệt tiêu khi so sánh. Chỉ phần "thêm" mới quyết định.</p>
<div class="mh">Vì sao người ta hay mắc bẫy?</div><p>Tâm lý ngại thừa nhận sai lầm và cảm giác "bỏ thì phí". Hiện tượng này có tên là <b>ngụy biện chi phí chìm</b> (sunk cost fallacy) hay <b>leo thang cam kết</b> (escalation of commitment, Barry Staw 1976). Ví dụ kinh điển: máy bay Concorde — hai chính phủ Anh, Pháp tiếp tục rót tiền dù đã thấy không có lãi, chủ yếu vì đã đầu tư quá nhiều.</p>
<div class="mh">Ví dụ thêm</div><p>Một công ty đã chi 3 tỷ phát triển một ứng dụng di động. Sau đó đối thủ ra mắt sản phẩm tương tự miễn phí. Lập luận "đã chi 3 tỷ rồi, dừng thì phí" là sai về kinh tế. Câu hỏi đúng: từ hôm nay, cần chi thêm bao nhiêu để hoàn thành và sẽ thu về bao nhiêu? Nếu phần thu thêm nhỏ hơn phần chi thêm thì nên dừng, dù 3 tỷ đã mất.</p><div class="mh">Lưu ý: chi phí chìm phải "thật sự không thu hồi được"</div><p>Nếu thiết bị đã mua còn bán lại được một phần, phần bán được đó <b>không</b> phải chi phí chìm mà là một dòng tiền của phương án "dừng". Ví dụ máy móc mua 5 tỷ, bán lại được 1 tỷ: chỉ 4 tỷ là chìm, còn 1 tỷ là lợi ích nếu dừng.</p>
<div class="mh">Phân biệt với chi phí cơ hội</div><div class="scroll"><table class="tbl"><thead><tr><th></th><th>Chi phí chìm</th><th>Chi phí cơ hội</th></tr></thead><tbody><tr><td>Thời điểm</td><td>Quá khứ, đã xảy ra</td><td>Hiện tại, tương lai</td></tr><tr><td>Có thay đổi theo quyết định?</td><td>Không</td><td>Có</td></tr><tr><td>Đưa vào quyết định?</td><td><b>Không</b></td><td><b>Có</b></td></tr></tbody></table></div>`},
 {t:'Nguyên lý 3 · Tư duy tại điểm cận biên',
  b:`<p><b>Câu hỏi mở đầu:</b> chọn sản lượng nào, thuê bao nhiêu lao động, có nên ăn thêm một phần ở tiệc buffet — dựa trên cơ sở nào? Có khi nào chấp nhận bán dưới chi phí trung bình?</p>
<p><b>Tình huống cửa hàng xăng dầu giờ cao điểm:</b> khách chờ lâu; cửa hàng có thể bổ sung tối đa 4 nhân viên theo ca. Lợi ích mong muốn: bán thêm xăng dầu, giảm thời gian chờ. Nguồn lực phải chi: tiền công, tổ chức ca. Doanh nghiệp đủ ngân sách trả — có đồng nghĩa nên thuê cả 4?</p>
<p>Giả định đóng góp sau chi phí biến đổi là 450 đồng/lít; mỗi người thêm tốn 700.000 đồng/ca. Lượng bán thêm: người 1 = 2.500 lít, người 2 = 2.100, người 3 = 1.700, người 4 = 1.300. Nhận xét: càng thêm nhân viên, sản lượng bán tăng thêm càng ít. Đừng chỉ hỏi "bán thêm bao nhiêu?" mà hỏi "phần tăng thêm mang lại lợi ích ròng bao nhiêu?".</p>
<p><b>Thay đổi biên</b> là điều chỉnh nhỏ trong kế hoạch hiện tại: thêm một sản phẩm, một giờ làm, một chuyến xe, một lao động. <b>Lợi ích cận biên (MB)</b>: lợi ích thu thêm khi tăng một đơn vị hoạt động. <b>Chi phí cận biên (MC)</b>: chi phí tăng thêm khi tăng một đơn vị hoạt động.</p>
<div class="scroll"><table class="tbl"><thead><tr><th>MB &gt; MC</th><th>MB = MC</th><th>MB &lt; MC</th></tr></thead><tbody><tr><td>Có lợi khi tăng thêm hoạt động</td><td>Ranh giới mở rộng</td><td>Không nên mở rộng</td></tr></tbody></table></div>
<p>Với mức tăng rời rạc: chọn mức có tổng lợi ích ròng lớn nhất.</p>
${svgStaff}
<p>MB người 1 = 2.500 × 450 = 1.125 nghìn; người 2 = 945; người 3 = 765; người 4 = 585. Trừ MC 700: +425, +245, +65, −115. → Theo mục tiêu lợi nhuận: <b>bổ sung 3 nhân viên</b>. Nếu có ràng buộc dịch vụ (thời gian chờ, an toàn, tiêu chuẩn phục vụ) thì xét thêm; <i>chỉ tối ưu trong tập phương án đáp ứng các yêu cầu bắt buộc</i>. Quy mô phù hợp không nhất thiết là quy mô lớn nhất.</p>
<p><b>Điều kiện áp dụng trong kinh doanh xăng dầu:</b> an toàn và tuân thủ (PCCC, chất lượng, quy định); năng lực và cơ hội khác (cột bơm, xe bồn, ca làm việc, chi phí cơ hội); mục tiêu kinh doanh (chất lượng dịch vụ, lợi ích dài hạn).</p>
<p><b>Ba câu hỏi trước khi mở rộng một hoạt động:</b> lợi ích tăng thêm là bao nhiêu (không đồng nhất doanh thu tăng với hiệu quả tăng)? Chi phí tăng thêm là bao nhiêu (kể cả chi phí cơ hội)? Phương án có đáp ứng ràng buộc (an toàn, chất lượng, năng lực, quy định)?</p>`,
  m:`<div class="mh">Hiểu đơn giản</div><p>"Cận biên" = <b>đơn vị tiếp theo</b>. Câu hỏi cận biên không phải "cả dự án có lãi không" mà là "<b>thêm một</b> người / một chuyến / một ca nữa thì lợi thêm bao nhiêu, tốn thêm bao nhiêu?". Còn lợi thêm lớn hơn tốn thêm thì làm tiếp; đến lúc lợi thêm nhỏ hơn thì dừng.</p>
<div class="mh">Vì sao lợi ích cận biên giảm dần?</div><p>Cột bơm có hạn: người thứ nhất giải tỏa hàng chờ rất nhiều, người thứ tư thì các cột bơm đã gần kín việc, nên bán thêm ít. Đây là <b>quy luật năng suất cận biên giảm dần</b>, sẽ gặp kỹ ở CĐ4 (hành vi doanh nghiệp).</p>
<div class="mh">Ví dụ máy bay (bài của cô) — giải chi tiết</div><p>Máy bay 200 ghế, chuyến bay tốn 20.000 USD → chi phí trung bình 100 USD/ghế. Máy bay sắp cất cánh, còn 10 ghế trống, một khách chờ trả 80 USD. Hỏi đúng câu: <b>bán thêm ghế này thì tốn thêm bao nhiêu?</b> Gần như bằng 0 (một suất ăn, chút nhiên liệu) vì chuyến bay vẫn bay dù có khách này hay không. MB = 80 USD &gt; MC ≈ vài USD → <b>nên bán</b>. Con số 100 USD là chi phí trung bình, không dùng cho quyết định cận biên.</p>
<div class="mh">Ví dụ thêm</div><p>Một nhà hàng cân nhắc mở thêm đến 23h. So <b>doanh thu của hai giờ thêm</b> với <b>chi phí tăng thêm</b> của hai giờ đó (lương ca tối, điện, nguyên liệu) — không so với tổng chi phí cả ngày. Tiền thuê mặt bằng đã trả theo tháng không thay đổi nên không đưa vào.</p><div class="mh">Lỗi hay mắc</div><ul class="clean"><li>Dùng chi phí trung bình thay cho chi phí cận biên.</li><li>Quên chi phí cơ hội trong MC (bài chuyến giao: nếu phải bỏ chuyến khác lãi 1 triệu thì MC tăng thêm 1 triệu).</li><li>Tối ưu lợi nhuận mà vi phạm ràng buộc an toàn, PCCC.</li></ul>`},
 {t:'Nguyên lý 4 · Con người phản ứng với động cơ khuyến khích',
  b:`<p><b>Câu hỏi quản trị:</b> làm thế nào để cơ chế thưởng thúc đẩy hành vi phù hợp với mục tiêu doanh nghiệp?</p>
<p><b>Tình huống Công ty X</b> (kinh doanh thiết bị văn phòng): nhân viên bán vượt chỉ tiêu doanh số tháng được thưởng thêm 20% trên phần doanh thu vượt. Sau 6 tháng: doanh thu <b>+18%</b>, lợi nhuận gộp <b>−10%</b>, tỷ lệ tái ký <b>75% → 60%</b>, xuất hiện hành vi giảm giá sâu.</p>
<p>Cô hỏi: chính sách thành công hay thất bại? Vì sao nhân viên đạt chỉ tiêu mà lợi nhuận giảm? Vấn đề ở nhân viên hay ở thiết kế cơ chế thưởng?</p>
<p><b>Nguyên lý:</b> khuyến khích là yếu tố làm thay đổi lợi ích hoặc chi phí gắn với một hành vi. Thay đổi khuyến khích → thay đổi lợi ích, chi phí → thay đổi hành vi. Phản ứng phụ thuộc vào cách mỗi người nhận thức lợi ích, chi phí.</p>
<p><b>Khuyến khích không chỉ là tiền thưởng:</b> thưởng doanh thu (thúc đẩy số lượng, giá trị bán); thưởng lợi nhuận (chú ý biên lợi nhuận); ghi nhận – thăng tiến (động lực cải tiến, đóng góp); quy định – chế tài (hạn chế vi phạm).</p>
<p><b>Vì sao có kết quả ngoài mong đợi:</b> chạy theo chỉ tiêu (tập trung vào kết quả được thưởng); đánh đổi giữa các mục tiêu (cải thiện chỉ tiêu này nhưng làm giảm chất lượng hoạt động khác); hành vi đối phó (dịch chuyển doanh số, giảm giá, tranh giành khách hàng).</p>
<div class="scroll"><table class="tbl"><thead><tr><th>Cơ chế</th><th>Hành vi phát sinh</th><th>Hệ quả</th></tr></thead><tbody><tr><td>Thưởng theo doanh thu</td><td>Giảm giá để tăng hợp đồng</td><td>Lợi nhuận gộp giảm</td></tr><tr><td>Chú trọng khách hàng mới</td><td>Dồn sức tìm đơn mới</td><td>Khách cũ ít được chăm sóc, tái ký giảm</td></tr><tr><td>Thưởng theo tháng</td><td>Đẩy thời điểm ghi nhận hợp đồng</td><td>Doanh số phản ánh sai kỳ</td></tr><tr><td>Thưởng chủ yếu cá nhân</td><td>Tranh giành hợp đồng</td><td>Giảm phối hợp trong đội</td></tr></tbody></table></div>
<p>Đạt KPI chưa đồng nghĩa đạt mục tiêu kinh doanh.</p>
<p><b>Ra quyết định:</b> A — giữ thưởng doanh thu (dễ áp dụng, chưa xử lý tác động ngược); B — thưởng lợi nhuận gộp (kiểm soát giảm giá, ít chú ý quan hệ dài hạn); <b>C — kết hợp nhiều tiêu chí</b> (cân bằng lợi nhuận, khách hàng, chất lượng) — phù hợp hơn: gắn thưởng với lợi nhuận gộp; xem tỷ lệ tái ký và chất lượng chăm sóc; kiểm soát chiết khấu, ghi nhận hợp đồng, quy trình.</p>
<p><b>Kiểm chứng trước khi áp dụng rộng:</b> thử nghiệm trong phạm vi phù hợp; theo dõi cả doanh thu, lợi nhuận, tái ký, chi phí thưởng; phát hiện hành vi không mong muốn và điều chỉnh. Không có công thức thưởng tối ưu cho mọi doanh nghiệp.</p>
<p><b>Bốn nguyên tắc thiết kế:</b> nhìn vào động cơ; gắn đúng mục tiêu; dự báo phản ứng; theo dõi và sửa đổi.</p>
<div class="note"><b>Thông điệp của cô:</b> chính sách khuyến khích hiệu quả là chính sách khiến lợi ích của người thực hiện gắn với mục tiêu thực sự của doanh nghiệp. Hãy tự hỏi: "Nếu tôi là người được thưởng theo chính sách này, tôi sẽ thay đổi hành vi như thế nào?"</div>`,
  m:`<div class="mh">Hiểu đơn giản</div><p>Người ta làm theo <b>cái được đo và được thưởng</b>, không phải theo cái mình mong. Thưởng theo doanh thu thì nhân viên tối đa doanh thu — kể cả bằng cách giảm giá làm mất lãi. Họ không "xấu"; họ phản ứng hợp lý với luật chơi.</p>
<div class="mh">Lý thuyết đằng sau</div><p><b>Vấn đề người ủy quyền – người đại diện</b> (principal–agent problem, Jensen &amp; Meckling 1976): chủ doanh nghiệp (ủy quyền) muốn lợi nhuận dài hạn; nhân viên (đại diện) muốn tối đa tiền thưởng của mình. Khi hai lợi ích lệch nhau và chủ không quan sát hết hành vi, cơ chế thưởng là công cụ để "kéo" hai lợi ích về một hướng.</p><p><b>Định luật Goodhart:</b> "khi một thước đo trở thành mục tiêu, nó không còn là thước đo tốt". Tỷ lệ tái ký từng là dấu hiệu khách hài lòng; nhưng nếu chỉ thưởng theo tái ký, nhân viên có thể tặng quà để ép khách ký lại.</p>
<div class="mh">Ví dụ thêm</div><ul class="clean"><li>Ngân hàng thưởng nhân viên theo dư nợ cho vay → dễ cho vay dễ dãi, nợ xấu tăng sau vài năm.</li><li>Tổng đài chăm sóc khách hàng thưởng theo số cuộc gọi xử lý → nhân viên kết thúc cuộc gọi sớm, vấn đề của khách không được giải quyết.</li><li>Thưởng theo số bài báo đăng → tăng số lượng, giảm chất lượng.</li></ul><div class="mh">Cách viết bài tự luận dạng này</div><ol class="clean"><li>Mô tả cơ chế khuyến khích hiện tại (thưởng gì, đo gì).</li><li>Dự báo hành vi của người được thưởng ("nếu tôi là họ…").</li><li>Chỉ ra hành vi đó lệch mục tiêu thật ở đâu (lợi nhuận, khách hàng, chất lượng, phối hợp).</li><li>Đề xuất cơ chế kết hợp nhiều tiêu chí, có trọng số, có kiểm soát.</li><li>Đề xuất thử nghiệm và theo dõi trước khi áp dụng rộng.</li></ol>
`}
 ],
 sum:{core:'Ra quyết định tốt là: so với phương án thay thế tốt nhất, chỉ tính phần thay đổi từ nay về sau, và thiết kế khuyến khích để người thực hiện muốn đúng điều doanh nghiệp muốn.',
  pillars:[['01','Đánh đổi','Hy sinh điều gì?','var(--ktud)'],['02','Chi phí cơ hội','Mất thật bao nhiêu?','var(--gold)'],['03','Cận biên','Thêm 1 đơn vị nữa?','var(--qtcl)'],['04','Khuyến khích','Hành vi đổi ra sao?','var(--violet)']],
  recap:['<b>Khan hiếm → lựa chọn → đánh đổi.</b> Mọi phương án đều có cái giá; câu trả lời đúng luôn gắn với bối cảnh ("ưu tiên A khi…").','<b>LN kinh tế = DT − chi phí hiện − chi phí ẩn.</b> Chi phí cơ hội = phương án thay thế tốt nhất bị bỏ, không cộng tất cả.','<b>Chi phí chìm không vào quyết định.</b> Chỉ so phần chi thêm với phần thu thêm.','<b>MB &gt; MC thì làm tiếp.</b> Dùng chi phí cận biên, không dùng chi phí trung bình; tôn trọng ràng buộc an toàn.','<b>Người ta làm theo cái được thưởng.</b> Thưởng nhiều tiêu chí, thử nghiệm trước.'],

{id:'cd2',n:2,title:'Hoạt động của thị trường',sub:'Cung – cầu, độ co giãn, cú sốc và can thiệp của Chính phủ',status:'done',src:'Slide giảng viên',
 intro:'Chuyên đề này giải thích giá cả hình thành thế nào và vì sao thay đổi. Có thể coi thị trường như một chiếc cân: một bên là người mua (cầu), một bên là người bán (cung), giá cân bằng là điểm hai bên cân nhau. Khi có cú sốc hay Nhà nước can thiệp, hệ chuyển sang trạng thái cân bằng mới.',
 topics:[
 {t:'Cầu và sự thay đổi của cầu',
  b:`<p><b>Câu hỏi mở đầu:</b> sản lượng xăng dầu bán ra tại một khu vực giảm. Có thể kết luận "cầu thị trường giảm" chưa? Cần phân tích: giá bán, nhu cầu, cạnh tranh hay khả năng cung ứng?</p>
<p><b>Cầu (demand)</b> là lượng hàng người mua <b>sẵn sàng và có khả năng</b> mua tại các mức giá, trong một thời kỳ. Hai điều kiện hình thành cầu: <b>mong muốn mua + khả năng thanh toán</b>.</p>
<p><b>Quy luật cầu:</b> giá tăng → lượng cầu giảm, nếu các yếu tố khác không đổi. (Câu hỏi của cô: giá xăng tăng, vì sao người tiêu dùng vẫn tiếp tục mua? → vì xăng là hàng thiết yếu, khó thay thế ngay; lượng mua giảm ít chứ không mất hẳn.)</p>
<p><b>Đường cầu và sự thay đổi lượng cầu:</b> khi giá thay đổi → di chuyển <b>dọc theo</b> đường cầu (từ điểm A sang điểm B).</p>
<p><b>Các yếu tố làm dịch chuyển cầu:</b></p>
<ul class="clean"><li><b>Thu nhập</b> — thay đổi khả năng tiêu dùng</li><li><b>Giá hàng liên quan</b> — hàng thay thế hoặc bổ sung</li><li><b>Thị hiếu</b> — thay đổi ưu tiên lựa chọn</li><li><b>Kỳ vọng</b> — mua sớm hoặc trì hoãn</li><li><b>Yếu tố khác</b> — mùa vụ, quy mô người mua</li></ul>
<div class="scroll"><table class="tbl"><thead><tr><th>Thay đổi LƯỢNG CẦU</th><th>Thay đổi CẦU</th></tr></thead><tbody><tr><td>Do giá của chính hàng hóa thay đổi</td><td>Do yếu tố ngoài giá thay đổi</td></tr><tr><td>Di chuyển dọc đường cầu</td><td>Dịch chuyển cả đường cầu</td></tr></tbody></table></div>
<p><b>Vận dụng — chẩn đoán biến động nhu cầu:</b> thị trường xăng ở một địa bàn có 3 diễn biến: (1) giá bán lẻ xăng tăng → <i>thay đổi lượng cầu</i>; (2) nhiều khách chuyển sang xe điện → <i>cầu dịch chuyển sang trái</i>; (3) một cửa hàng mất khách vào tay đối thủ → <i>mất thị phần</i>, không phải cầu toàn thị trường giảm.</p>`,
  m:`<div class="mh">Hiểu đơn giản</div><p><b>Đường cầu</b> là một "bảng giá – lượng" của người mua: ở giá 20.000đ họ mua bao nhiêu, ở 25.000đ mua bao nhiêu. Khi chỉ giá thay đổi, ta chỉ <b>đọc một dòng khác trên cùng bảng</b> (di chuyển dọc đường). Khi thu nhập, thị hiếu… thay đổi, <b>cả bảng thay đổi</b> — ở mọi mức giá người ta đều mua nhiều hơn hoặc ít hơn (dịch chuyển đường).</p>
<div class="mh">Hàng thay thế và hàng bổ sung</div><ul class="clean"><li><b>Thay thế</b>: dùng cái này thay cái kia (xe buýt – taxi; xăng E10 – xăng khoáng). Giá cái này tăng → cầu cái kia tăng.</li><li><b>Bổ sung</b>: dùng cùng nhau (ô tô chạy xăng – xăng; xi măng – cát). Giá cái này tăng → cầu cái kia giảm.</li></ul>
<div class="mh">Ví dụ thêm</div><p>Giá thịt lợn tăng mạnh: lượng thịt lợn được mua giảm (di chuyển dọc đường cầu thịt lợn). Đồng thời nhiều gia đình chuyển sang thịt gà, cá — <b>cầu thịt gà tăng</b> (đường cầu thịt gà dịch phải) vì đó là hàng thay thế.</p><div class="mh">Lỗi hay mắc</div><p>Nói "giá tăng làm cầu giảm" là <b>sai thuật ngữ</b> trong bài thi. Đúng phải là "giá tăng làm <b>lượng cầu</b> giảm". "Cầu giảm" chỉ dùng khi đường cầu dịch chuyển.</p>`},
 {t:'Độ co giãn của cầu',
  b:`<p>Cùng mức tăng giá 10%, sản phẩm A giảm lượng cầu 3%, sản phẩm B giảm 18% — khách phản ứng khác nhau. <b>Độ co giãn</b> là thước đo độ nhạy của lượng cầu trước thay đổi của một yếu tố. Có 3 loại: theo giá, theo giá chéo, theo thu nhập.</p>
<p><b>1. Độ co giãn theo giá</b></p><div class="formula">E<sub>DP</sub> = % thay đổi lượng cầu / % thay đổi giá</div>
<p>Ví dụ: giá tăng 5%, lượng cầu giảm 2% → E = −0,4: giá tăng 1% thì lượng cầu giảm khoảng 0,4%.</p>
<div class="scroll"><table class="tbl"><thead><tr><th>Mức</th><th>Điều kiện</th><th>Ý nghĩa</th></tr></thead><tbody><tr><td>Co giãn nhiều</td><td>|E| &gt; 1</td><td>Lượng cầu biến động mạnh hơn giá</td></tr><tr><td>Co giãn đơn vị</td><td>|E| = 1</td><td>% thay đổi lượng bằng % thay đổi giá</td></tr><tr><td>Co giãn ít</td><td>|E| &lt; 1</td><td>Lượng cầu biến động yếu hơn giá</td></tr></tbody></table></div>
<p>Dùng giá trị tuyệt đối vì E<sub>DP</sub> thường mang dấu âm. Trên đường cầu tuyến tính: đoạn trên điểm giữa |E| &gt; 1, tại điểm giữa |E| = 1, đoạn dưới |E| &lt; 1.</p>
<p><b>Vì sao độ co giãn khác nhau?</b> Hàng thay thế (càng dễ thay thế càng co giãn); tính thiết yếu (hàng thiết yếu khó giảm ngay); tỷ trọng chi tiêu (chiếm tỷ trọng lớn → nhạy giá hơn); thời gian (dài hạn dễ điều chỉnh hơn). Nhiên liệu đi lại: ngắn hạn kém co giãn; du lịch: nhạy giá hơn; nhãn hàng có nhiều đối thủ: có thể co giãn cao. Không dùng một hệ số cố định cho mọi thị trường.</p>
<p><b>Giá thay đổi tác động đến doanh thu ra sao?</b> TR = P × Q. Giá tăng làm doanh thu mỗi đơn vị tăng nhưng thường làm lượng giảm; tác động nào trội hơn quyết định kết quả.</p>
<div class="scroll"><table class="tbl"><thead><tr><th>Loại cầu</th><th>Khi giá tăng</th><th>Khi giá giảm</th></tr></thead><tbody><tr><td>Co giãn nhiều</td><td>Doanh thu giảm</td><td>Doanh thu tăng</td></tr><tr><td>Co giãn đơn vị</td><td>Gần như không đổi</td><td>Gần như không đổi</td></tr><tr><td>Co giãn ít</td><td>Doanh thu tăng</td><td>Doanh thu giảm</td></tr></tbody></table></div>
<p><b>2. Độ co giãn chéo:</b> E<sub>XY</sub> = %ΔQ<sub>X</sub> / %ΔP<sub>Y</sub>. E &gt; 0: thay thế (xe buýt – taxi); E &lt; 0: bổ sung (ô tô xăng – xăng); E ≈ 0: quan hệ rất yếu. Ví dụ: giá vận tải A tăng 10%, cầu dịch vụ B tăng 6% → E = +0,6, thay thế; biến động giá đối thủ có thể tạo cơ hội thu hút nhu cầu.</p>
<p><b>3. Độ co giãn theo thu nhập:</b> E<sub>I</sub> = %ΔQ / %ΔI. E &lt; 0: hàng thứ cấp; 0 &lt; E &lt; 1: hàng thông thường phản ứng thấp hơn thu nhập; E &gt; 1: phản ứng mạnh hơn thu nhập.</p>
<p><b>Tình huống:</b> thu nhập tăng nhưng thị trường chuyển từ xe xăng sang xe điện. Tác động thúc đẩy cầu xăng (đi lại nhiều hơn, sở hữu phương tiện tăng) và tác động kìm hãm (xe tiết kiệm nhiên liệu, chuyển sang xe điện) diễn ra cùng lúc.</p>`,
  m:`<div class="mh">Hiểu đơn giản</div><p>Độ co giãn là <b>hệ số độ nhạy</b>: "giá thay đổi 1% thì lượng mua thay đổi bao nhiêu %". |E| = 0,4 nghĩa là khách "lì" với giá; |E| = 1,8 nghĩa là khách rất nhạy.</p>
<div class="mh">Bài tập của cô — giải từng bước</div><p>Giá 20.000 → 22.000đ, lượng 1.000 → 930.</p><ol class="clean"><li>Doanh thu trước: 20.000 × 1.000 = 20,0 triệu. Sau: 22.000 × 930 = 20,46 triệu → tăng 2,3%.</li><li>Dùng phương pháp trung điểm: giá trung bình (20.000 + 22.000)/2 = 21.000; lượng trung bình (1.000 + 930)/2 = 965.</li><li>%ΔQ = (930 − 1.000)/965 = −7,25%. %ΔP = (22.000 − 20.000)/21.000 = +9,52%.</li><li>E = −7,25 / 9,52 ≈ <b>−0,76</b> → |E| &lt; 1, cầu kém co giãn → tăng giá làm doanh thu tăng (khớp bước 1).</li></ol><p><b>Câu hỏi bẫy của cô:</b> doanh thu tăng có đồng nghĩa lợi nhuận tăng? Chưa chắc — cần xem chi phí. Ở đây lượng bán giảm nên chi phí biến đổi cũng giảm, lợi nhuận nhiều khả năng tăng; nhưng phải có số liệu chi phí mới kết luận được.</p>
<div class="mh">Vì sao dùng phương pháp trung điểm?</div><p>Nếu tính % theo giá gốc, đi từ 20.000 lên 22.000 là +10%, nhưng đi ngược từ 22.000 xuống 20.000 là −9,1% — cùng một đoạn mà ra hai con số. Trung điểm cho kết quả như nhau dù đi chiều nào. Nếu đề không nói rõ, nên ghi "tính theo phương pháp trung điểm".</p>
<div class="mh">Ví dụ thêm</div><ul class="clean"><li>Xăng nói chung kém co giãn trong ngắn hạn: giá tăng, tổng lượng bán toàn thị trường giảm ít.</li><li>Nhưng với <b>một cửa hàng cụ thể</b>, cầu co giãn hơn nhiều vì khách có thể sang cửa hàng bên cạnh. Cầu "của thị trường" và cầu "của một doanh nghiệp" có độ co giãn khác nhau.</li><li>Hàng xa xỉ (du lịch nước ngoài, xe sang) thường có độ co giãn theo thu nhập lớn hơn 1: thu nhập tăng 10%, chi tiêu cho chúng tăng hơn 10%.</li></ul>`},
 {t:'Cung và độ co giãn của cung',
  b:`<p><b>Cung thị trường</b> là lượng hàng người bán sẵn sàng và có khả năng bán tại các mức giá. <b>Quy luật cung:</b> các yếu tố khác không đổi, giá tăng → lượng cung thường tăng; đường cung thông thường dốc lên.</p>
<p><b>Các yếu tố làm thay đổi cung:</b> chi phí đầu vào (tăng → cung giảm); công nghệ (hiệu quả tăng → cung tăng); năng lực cung ứng (mở rộng → cung tăng); chính sách (thuế, quy định, hỗ trợ); kỳ vọng và rủi ro (giá tương lai, yếu tố gián đoạn nguồn cung).</p>
<p>Giống như cầu: giá hàng hóa thay đổi → <b>di chuyển dọc</b> đường cung; yếu tố ngoài giá thay đổi → <b>dịch chuyển</b> đường cung.</p>
<div class="formula">E<sub>S</sub> = % thay đổi lượng cung / % thay đổi giá</div>
<div class="scroll"><table class="tbl"><thead><tr><th>Ngắn hạn</th><th>Dài hạn</th></tr></thead><tbody><tr><td>Công suất khó thay đổi; phụ thuộc tồn kho và hợp đồng; khả năng điều chỉnh hạn chế</td><td>Có thể mở rộng hạ tầng, điều chỉnh mạng lưới cung ứng; khả năng thích ứng lớn hơn</td></tr></tbody></table></div>
<p><b>Tình huống gián đoạn nguồn cung xăng dầu:</b> chi phí vận chuyển tăng, thời gian giao hàng kéo dài, giá bán có xu hướng tăng. Cô hỏi: yếu tố nào làm cung thay đổi? Giá bán và chi phí tác động khác nhau ra sao? Vì sao lượng cung có thể chưa tăng ngay? Doanh nghiệp cần theo dõi chỉ báo nào?</p>
<p><b>Ý nghĩa với doanh nghiệp:</b> hoạch định nguồn hàng; quản trị chi phí (theo dõi yếu tố dịch chuyển cung); tồn kho và phân phối theo địa bàn; đầu tư mở rộng năng lực cung dài hạn.</p>`,
  m:`<div class="mh">Hiểu đơn giản</div><p>Người bán bán nhiều hơn khi giá cao hơn vì lúc đó những nguồn hàng đắt hơn (nhập từ xa, chạy thêm ca) mới bắt đầu có lãi. Độ co giãn của cung cho biết họ "tăng tốc" được nhanh đến đâu.</p>
<div class="mh">Trả lời tình huống gián đoạn nguồn cung</div><ol class="clean"><li><b>Yếu tố làm cung thay đổi:</b> chi phí vận chuyển tăng và rủi ro gián đoạn → đường cung dịch sang trái.</li><li><b>Giá bán và chi phí khác nhau thế nào:</b> chi phí tăng ngay, còn giá bán (nhất là khi bị điều hành) có thể tăng chậm hơn → biên lợi nhuận bị ép.</li><li><b>Vì sao lượng cung chưa tăng ngay dù giá tăng:</b> ngắn hạn bị giới hạn bởi sức chứa kho, số xe bồn, hợp đồng nhập đã ký — cung kém co giãn.</li><li><b>Chỉ báo cần theo dõi:</b> tồn kho theo kho, thời gian giao hàng, giá nhập, mức bán theo khu vực, lịch tàu.</li></ol>
<div class="mh">Ví dụ thêm</div><p>Khi giá nhà ở tăng mạnh, nguồn cung căn hộ không tăng ngay vì từ lúc có đất đến lúc bàn giao mất nhiều năm — cung ngắn hạn gần như không co giãn. Ngược lại, khi giá rau tăng, nông dân có thể trồng thêm sau vài tuần — cung co giãn hơn.</p>`},
 {t:'Cân bằng thị trường và các cú sốc',
  b:`<p>Phía người mua: cầu cho biết khách muốn và có thể mua bao nhiêu tại các mức giá. Phía người bán: cung cho biết doanh nghiệp sẵn sàng bán bao nhiêu. Giá thị trường hình thành từ tương tác giữa hai phía.</p>
<p><b>Cân bằng:</b> lượng cung = lượng cầu, tại giao điểm E xác định P₀ và Q₀. Trong mô hình cạnh tranh cơ bản, tại đây không có áp lực giá do dư cung hoặc dư cầu.</p>
<ul class="clean"><li><b>P &gt; P₀:</b> lượng cung &gt; lượng cầu → dư cung, hàng dư thừa, xuất hiện áp lực giảm giá.</li><li><b>P &lt; P₀:</b> lượng cầu &gt; lượng cung → thiếu hụt, xuất hiện áp lực tăng giá.</li></ul>
<p><b>Giá cả là tín hiệu điều phối:</b> với người tiêu dùng, giá phản ánh chi phí mua hàng (điều chỉnh lượng mua, chọn hàng thay thế); với doanh nghiệp, giá phản ánh cơ hội kinh doanh (điều chỉnh cung ứng, đầu tư); với toàn thị trường, giá phản ánh khan hiếm tương đối (định hướng phân bổ nguồn lực).</p>
<p><b>Khi giá không điều chỉnh linh hoạt</b> (bị ràng buộc bởi quy định, hợp đồng): mất cân đối được điều chỉnh qua tồn kho, lượng giao dịch, có thể xuất hiện thời gian chờ. Trong xăng dầu cần phân biệt <b>tín hiệu giá</b> với <b>quyền điều chỉnh giá bán</b>.</p>
<p><b>Tình huống nghỉ lễ:</b> cửa hàng trên quốc lộ khách tăng, phải chờ bổ sung hàng; cửa hàng khu vực khác bán thấp hơn dự kiến, tồn kho lớn. Đây là mất cân đối tại cửa hàng hay của toàn thị trường?</p>
<p><b>Cú sốc thị trường:</b></p>
<div class="scroll"><table class="tbl"><thead><tr><th>Cú sốc</th><th>Giá P</th><th>Lượng Q</th></tr></thead><tbody><tr><td>Cầu tăng</td><td>↑</td><td>↑</td></tr><tr><td>Cầu giảm</td><td>↓</td><td>↓</td></tr><tr><td>Cung tăng</td><td>↓</td><td>↑</td></tr><tr><td>Cung giảm</td><td>↑</td><td>↓</td></tr><tr><td>Cầu ↑ và cung ↑</td><td>Chưa xác định</td><td>↑</td></tr><tr><td>Cầu ↓ và cung ↓</td><td>Chưa xác định</td><td>↓</td></tr><tr><td>Cầu ↑ và cung ↓</td><td>↑</td><td>Chưa xác định</td></tr><tr><td>Cầu ↓ và cung ↑</td><td>↓</td><td>Chưa xác định</td></tr></tbody></table></div>
<p><b>4 bước phân tích cú sốc:</b> (1) xác định cú sốc — yếu tố nào đã thay đổi? (2) xác định đường — cung hay cầu dịch chuyển? (3) so sánh cân bằng — P và Q mới ra sao? (4) hàm ý quản trị — nguồn hàng, tồn kho, phân phối.</p>
<p><b>Case study của cô:</b> cú sốc 1 (phía cung) — vận chuyển gián đoạn, chi phí nhập tăng, giao chậm; cú sốc 2 (phía cầu) — kinh tế chững lại, doanh nghiệp vận tải cắt giảm nhu cầu nhiên liệu. Với doanh nghiệp: giá bán chịu ràng buộc điều hành, năng lực kho và giao hàng hữu hạn, có thể điều chuyển liên vùng. Không đủ dữ liệu dự báo chính xác P, Q mới → phải vẽ mô hình, dự báo hướng, lập kịch bản (cung mạnh hơn hay cầu mạnh hơn), chọn 2 hành động ưu tiên và chỉ báo giám sát.</p>
<p>Mô hình giúp dự báo <b>hướng</b> tác động, không thay thế dữ liệu và quyết định thực tế.</p>`,
  m:`<div class="mh">Hiểu đơn giản</div><p>Nghĩ về cân bằng như <b>mực nước trong bể có vòi vào (cung) và vòi ra (cầu)</b>: nếu vào nhiều hơn ra (dư cung), mực nước dâng → người bán phải hạ giá để xả hàng. Nếu ra nhiều hơn vào (thiếu hụt), bể cạn → người mua sẵn sàng trả cao hơn. Giá tự điều chỉnh đến khi vào = ra.</p>
<div class="mh">Mẹo nhớ bảng cú sốc</div><ul class="clean"><li><b>Cú sốc cầu</b>: P và Q đi <b>cùng chiều</b> (cầu tăng thì cả hai tăng).</li><li><b>Cú sốc cung</b>: P và Q đi <b>ngược chiều</b> (cung giảm thì giá tăng, lượng giảm).</li><li><b>Cú sốc kép</b>: lần lượt xét từng cú sốc; đại lượng nào hai cú sốc kéo <b>cùng hướng</b> thì kết luận được, đại lượng bị kéo ngược hướng thì "chưa xác định" (phụ thuộc cú sốc nào mạnh hơn).</li></ul>
<div class="mh">Giải case study của cô</div><p>Cung giảm (đường S dịch trái) + cầu giảm (đường D dịch trái). Cả hai đều làm <b>Q giảm</b> → chắc chắn lượng giảm. Về giá: cung giảm đẩy giá lên, cầu giảm kéo giá xuống → <b>P chưa xác định</b>. Kịch bản: nếu cú sốc cung mạnh hơn → giá tăng; nếu cú sốc cầu mạnh hơn → giá giảm. Hai hành động ưu tiên gợi ý: (1) điều chuyển hàng liên vùng theo nhu cầu thực tế; (2) điều chỉnh mức tồn kho, tránh tích trữ quá mức khi cầu đang giảm. Chỉ báo: sản lượng bán theo khu vực, giá nhập, thời gian giao hàng.</p>
<div class="mh">Tình huống nghỉ lễ — trả lời</div><p>Đây chủ yếu là <b>mất cân đối cục bộ giữa các cửa hàng</b>, không phải của toàn thị trường: tổng hàng có thể đủ nhưng phân bổ chưa đúng nơi. Giải pháp là điều phối hàng theo dự báo nhu cầu từng tuyến, không phải tăng nhập.</p>`},
 {t:'Thất bại thị trường và cơ sở để Nhà nước can thiệp',
  b:`<p><b>Vai trò của cơ chế thị trường:</b> giá là tín hiệu điều phối — phản ánh khan hiếm tương đối → người mua và người bán điều chỉnh hành vi → nguồn lực dịch chuyển theo tín hiệu thị trường. Thị trường tạo động lực cạnh tranh, nâng hiệu quả và đổi mới.</p>
<p><b>Vì sao thị trường không phải lúc nào cũng hiệu quả?</b></p>
<ul class="clean"><li><b>Ngoại ứng</b>: chi phí hoặc lợi ích xã hội không được phản ánh đầy đủ trong quyết định tư nhân — ví dụ phát thải từ tiêu thụ nhiên liệu.</li><li><b>Quyền lực thị trường</b>: doanh nghiệp có khả năng ảnh hưởng đến giá, sản lượng; mức tập trung cao có thể tạo sức mạnh thị trường.</li><li><b>Thông tin bất cân xứng</b>: các bên nắm giữ thông tin không ngang nhau — ví dụ thông tin chất lượng, nguồn gốc nhiên liệu.</li></ul>
<p>Thất bại thị trường là một cơ sở kinh tế quan trọng để Nhà nước can thiệp.</p>
<p><b>Mục tiêu can thiệp:</b> nâng cao hiệu quả kinh tế (khắc phục thất bại thị trường, kiểm soát ngoại ứng, quyền lực thị trường) và thực hiện mục tiêu xã hội (hỗ trợ nhóm dễ bị tổn thương, ổn định và bảo đảm tiếp cận hàng thiết yếu). Không phải mọi can thiệp đều xuất phát từ thất bại thị trường.</p>
<p>Ba nhóm công cụ được học: <b>can thiệp trực tiếp vào giá</b> (giá trần, giá sàn), <b>thuế</b>, <b>trợ cấp</b>.</p>`,
  m:`<div class="mh">Hiểu đơn giản</div><p>Thị trường hoạt động tốt khi giá phản ánh <b>đúng và đủ</b> mọi chi phí, lợi ích, và hai bên đều biết rõ thứ mình mua bán. Ba thất bại là ba cách giá "nói sai":</p><ul class="clean"><li><b>Ngoại ứng:</b> giá xăng không tính tiền khói bụi mà người đi đường phải hít → xã hội tiêu dùng nhiều hơn mức tối ưu.</li><li><b>Quyền lực thị trường:</b> vài doanh nghiệp lớn đủ sức đặt giá cao hơn chi phí.</li><li><b>Thông tin bất cân xứng:</b> người mua không kiểm tra được chất lượng xăng tại chỗ, nên dễ bị bán hàng kém chất lượng.</li></ul>
<div class="mh">Ví dụ thêm</div><p>Nhà máy xả khói gây ảnh hưởng sức khỏe dân xung quanh mà không phải trả tiền — ngoại ứng tiêu cực. Tiêm vắc-xin bảo vệ cả người xung quanh — ngoại ứng tích cực. Người bán xe cũ biết rõ xe hơn người mua — thông tin bất cân xứng, nên mới có dịch vụ kiểm định xe.</p><div class="mh">Nguồn gốc lý thuyết</div><p>Khái niệm ngoại ứng và thuế điều chỉnh ngoại ứng gắn với <b>Arthur Pigou</b> (1920) — thuế bảo vệ môi trường đối với xăng dầu là một dạng "thuế Pigou". Thông tin bất cân xứng gắn với <b>George Akerlof</b> (bài "thị trường xe cũ", 1970; Nobel 2001).</p>
`},
 {t:'Can thiệp trực tiếp vào giá: giá trần và giá sàn',
  b:`<p>Giới hạn giá có thể bảo vệ một nhóm, nhưng làm thay đổi tín hiệu cung – cầu.</p>
<ul class="clean"><li><b>Giá trần</b>: giá tối đa được phép giao dịch, thường nhằm bảo vệ người mua.</li><li><b>Giá sàn</b>: giá tối thiểu được phép giao dịch, thường nhằm hỗ trợ người bán.</li></ul>
<div class="pillars" style="grid-template-columns:1fr 1fr"><div>${svgCeil}</div><div>${svgFloor}</div></div>
<p><b>Giá trần có hiệu lực</b> (thấp hơn giá cân bằng): lượng cầu &gt; lượng cung → <b>thiếu hụt</b>; giá không thể tăng vượt trần; có thể phát sinh <b>phân bổ phi giá</b> (xếp hàng, hạn mức, quan hệ). Giá trần chỉ gây thiếu hụt trong mô hình khi có hiệu lực ràng buộc.</p>
<p><b>Giá sàn có hiệu lực</b> (cao hơn giá cân bằng): lượng cung &gt; lượng cầu → <b>dư thừa</b>, áp lực tiêu thụ, tồn kho, cần cơ chế xử lý lượng dư. Giá sàn không tự bảo đảm người bán tiêu thụ hết hàng ở mức giá quy định.</p>
<div class="scroll"><table class="tbl"><thead><tr><th>Tiêu chí</th><th>Giá trần</th><th>Giá sàn</th></tr></thead><tbody><tr><td>Mức giá ràng buộc</td><td>Thấp hơn giá cân bằng</td><td>Cao hơn giá cân bằng</td></tr><tr><td>Mất cân đối</td><td>Thiếu hụt: Qd &gt; Qs</td><td>Dư thừa: Qs &gt; Qd</td></tr><tr><td>Rủi ro chính</td><td>Phân bổ không qua giá</td><td>Tồn kho, khó tiêu thụ</td></tr><tr><td>Hàm ý quản trị</td><td>Bảo đảm nguồn hàng</td><td>Dự báo lượng bán và tồn kho</td></tr></tbody></table></div>
<p><b>Hàm ý quản trị khi thị trường có điều tiết giá:</b> nhận diện ràng buộc (giá giới hạn, mức độ ràng buộc) → dự báo phản ứng (thiếu hụt, dư thừa, nhu cầu) → điều chỉnh vận hành (nguồn hàng, tồn kho, phân phối, chi phí) → giám sát kết quả (chất lượng phục vụ, tiếp cận, rủi ro). Khi giá bị ràng buộc, năng lực thích ứng vận hành càng quan trọng.</p>
<p><b>Thảo luận của cô:</b> giả sử Chính phủ áp giá trần xăng dầu để bảo vệ người tiêu dùng, tránh lạm phát. (1) Hiện tượng ngắn hạn, dài hạn? (2) Doanh nghiệp xăng dầu gặp khó khăn gì, phản ứng ra sao khi giá thế giới cao hơn trần? (3) Doanh nghiệp dùng xăng dầu làm đầu vào có rủi ro nguồn cung không? (4) Nếu là CEO doanh nghiệp vận tải, xây dựng kịch bản rủi ro và chính sách giá thế nào?</p>`,
  m:`<div class="mh">Hiểu đơn giản</div><p>Giá trần giống như <b>"khóa" van giá ở mức thấp</b>: người mua muốn mua nhiều hơn (vì rẻ), người bán muốn bán ít hơn (vì lãi thấp hoặc lỗ). Khoảng cách giữa hai lượng đó là hàng thiếu. Vì giá không được tăng để "phân chia" hàng khan hiếm, việc phân chia diễn ra bằng cách khác: ai đến trước, ai quen biết, xếp hàng.</p>
<div class="mh">Mẹo nhớ</div><p><b>Trần</b> nằm <b>dưới</b> cân bằng mới có tác dụng (nghe ngược nhưng đúng: trần cao hơn giá thị trường thì chẳng ai chạm tới). <b>Sàn</b> nằm <b>trên</b> cân bằng mới có tác dụng.</p>
<div class="mh">Gợi ý trả lời câu thảo luận giá trần xăng dầu</div><ol class="clean"><li><b>Ngắn hạn:</b> thiếu hụt cục bộ, xếp hàng, cửa hàng hạn chế bán; dài hạn: doanh nghiệp giảm nhập, giảm đầu tư hệ thống, nguồn cung giảm, có thể xuất hiện thị trường ngầm.</li><li><b>Doanh nghiệp xăng dầu:</b> khi giá thế giới cao hơn trần → lỗ trên mỗi lít, áp lực dòng tiền; phản ứng: cắt giảm nhập, ưu tiên khách hợp đồng, kiến nghị điều chỉnh cơ chế.</li><li><b>Doanh nghiệp dùng xăng dầu:</b> giá rẻ nhưng rủi ro không mua được hàng — với vận tải, thiếu nhiên liệu nguy hiểm hơn giá cao.</li><li><b>CEO vận tải:</b> ký hợp đồng cung cấp dài hạn với đầu mối, dự trữ hợp lý, đa dạng nhà cung cấp, đưa phụ phí nhiên liệu vào hợp đồng vận chuyển.</li></ol>
<div class="mh">Thực tế Việt Nam</div><p>Giá bán lẻ xăng dầu được điều hành theo kỳ dựa trên giá cơ sở và Quỹ bình ổn giá (NĐ 83/2014, 95/2021, 80/2023). Đây không hẳn là giá trần, nhưng khi giá thế giới tăng nhanh hơn giá điều hành thì tác động gần giống: đợt thiếu hàng cuối năm 2022 (nhiều cửa hàng tạm ngừng bán) là ví dụ của phân bổ phi giá. Dự thảo nghị định mới (lần 14, 30/9/2026) đi theo hướng doanh nghiệp tự quyết và kê khai giá — cần kiểm tra lại tình trạng ban hành. <a href="https://lsvn.vn/de-xuat-moi-ve-quy-binh-on-gia-xang-dau-a179866.html">Nguồn: LSVN</a></p>
<div class="mh">Ví dụ giá sàn</div><p>Giá sàn lương tối thiểu vùng; giá sàn thu mua lúa trong một số giai đoạn.</p>`},
 {t:'Can thiệp bằng thuế và trợ cấp',
  b:`<p><b>Thuế</b> không chỉ tạo nguồn thu mà còn ảnh hưởng đến giá và hành vi: tạo nguồn thu (tài trợ hàng hóa, dịch vụ công), điều tiết hành vi (thay đổi chi phí và động cơ giao dịch), xử lý ngoại ứng (đưa một phần chi phí xã hội vào quyết định).</p>
<p><b>Thuế theo đơn vị hàng hóa (t):</b> đường cung dịch lên đúng bằng mức thuế t; giá người mua trả (P<sub>M</sub>) tăng; giá người bán thực nhận (P<sub>B</sub>) giảm; lượng giao dịch giảm. Chênh lệch P<sub>M</sub> − P<sub>B</sub> = t.</p>
<p><b>Ai thực sự chịu thuế?</b> Người có nghĩa vụ nộp thuế không nhất thiết chịu toàn bộ gánh nặng. Ví dụ thuế 1.000đ/đơn vị: người mua gánh 700đ (70%), người bán 300đ — tỷ lệ thực tế tùy độ co giãn tương đối. <b>Quy tắc: bên kém co giãn tương đối thường chịu phần lớn gánh nặng thuế.</b> Cầu kém co giãn hơn → người mua chịu nhiều; cung kém co giãn hơn → người bán chịu nhiều.</p>
<p><b>Tình huống:</b> thuế nhiên liệu tăng 1.000đ/lít, cầu ngắn hạn kém co giãn. Cô hỏi: giá mua, giá thực nhận, lượng bán thay đổi thế nào? Cần biết thêm gì để xác định ai chịu nhiều hơn? Doanh thu, biên lợi nhuận thay đổi ra sao? Theo dõi lượng bán, nguồn hàng theo khu vực thế nào? Đề xuất 2 biện pháp ứng phó trong phạm vi quyền hạn.</p>
<p><b>Trợ cấp</b> thay đổi động cơ cung ứng, tiêu dùng hoặc khả năng tiếp cận: hỗ trợ người bán (giảm chi phí, thúc đẩy cung), hỗ trợ người mua (giảm giá thực trả), hỗ trợ có mục tiêu (nhóm, hoạt động ưu tiên).</p>
<p><b>Trợ cấp theo đơn vị (s):</b> đường cung dịch xuống/sang phải bằng s; giá người mua trả giảm; giá người bán nhận tăng; lượng giao dịch tăng. Giá người bán nhận − giá người mua trả = s. Bên kém co giãn tương đối hưởng phần lợi ích lớn hơn.</p>
<p><b>Lợi ích, chi phí:</b> hỗ trợ tiếp cận hàng thiết yếu, khuyến khích hoạt động có ích; nhưng tốn ngân sách (s × lượng được trợ cấp), có thể khuyến khích tiêu dùng quá mức, nguy cơ phân bổ sai mục tiêu. Tình huống: trợ giá bán lẻ đại trà hay hỗ trợ trực tiếp nhóm thu nhập thấp?</p>
<div class="scroll"><table class="tbl"><thead><tr><th>Công cụ</th><th>Cơ chế tác động</th><th>Vấn đề quản trị</th></tr></thead><tbody><tr><td>Giá trần</td><td>Giá tối đa ràng buộc → thiếu hụt</td><td>Nguồn cung, phân bổ hàng</td></tr><tr><td>Giá sàn</td><td>Giá tối thiểu ràng buộc → dư thừa</td><td>Tiêu thụ, tồn kho</td></tr><tr><td>Thuế</td><td>Chênh lệch giá mua – bán → giao dịch giảm</td><td>Sản lượng, gánh nặng thuế</td></tr><tr><td>Trợ cấp</td><td>Hỗ trợ theo đơn vị → giao dịch tăng</td><td>Lợi ích, kế hoạch nguồn hàng</td></tr></tbody></table></div>
<p><b>Khung 5 bước phân tích chính sách cho nhà quản trị:</b> (1) Mục tiêu — chính sách muốn giải quyết gì? (2) Cơ chế — tác động qua giá, cung hay cầu? (3) Thị trường — giá, lượng, phân bổ lợi ích đổi ra sao? (4) Doanh nghiệp — doanh thu, chi phí, nguồn hàng chịu ảnh hưởng gì? (5) Quyết định — điều chỉnh gì trong giới hạn pháp lý và thẩm quyền? Đi từ phân tích kinh tế học đến lựa chọn quản trị, không đảo ngược trình tự.</p>`,
  m:`<div class="mh">Hiểu đơn giản</div><p>Thuế như một <b>"cái nêm" chèn giữa</b> người mua và người bán: người mua trả nhiều hơn, người bán nhận ít hơn, khoảng chênh là tiền thuế. Ai bị nêm ép nhiều hơn? Người <b>khó né</b> hơn. Người mua xăng khó bỏ xăng ngay (kém co giãn) nên bị ép nhiều.</p>
<div class="mh">Công thức phân chia gánh nặng (bổ sung)</div><div class="formula">Phần người mua chịu = E<sub>S</sub> / (E<sub>S</sub> + |E<sub>D</sub>|)<br>Phần người bán chịu = |E<sub>D</sub>| / (E<sub>S</sub> + |E<sub>D</sub>|)</div><p>Ví dụ của cô (người mua 70%) tương ứng E<sub>S</sub> gấp khoảng 2,33 lần |E<sub>D</sub>|. Kiểm tra: 2,33 / (2,33 + 1) ≈ 0,70.</p>
<div class="mh">Gợi ý trả lời tình huống thuế nhiên liệu +1.000đ/lít</div><ol class="clean"><li>Giá người mua trả tăng gần 1.000đ (vì cầu kém co giãn), giá người bán nhận giảm ít, lượng bán giảm ít.</li><li>Để biết chính xác ai chịu bao nhiêu cần biết độ co giãn của cả cung và cầu.</li><li>Doanh thu của cửa hàng tính theo giá bán có thể tăng, nhưng biên lợi nhuận mỗi lít có thể giảm nhẹ.</li><li>Biện pháp: theo dõi sản lượng theo khu vực (vùng giáp ranh dễ mất khách), điều chỉnh tồn kho, tăng dịch vụ phi xăng dầu bù biên lợi nhuận.</li></ol>
<div class="mh">Phần mất không (deadweight loss)</div><p>Thuế, giá trần, giá sàn đều làm lượng giao dịch lệch khỏi mức cân bằng. Những giao dịch "đáng lẽ có lợi cho cả hai bên" nhưng không xảy ra nữa tạo thành phần phúc lợi bị mất cho xã hội — gọi là <b>phần mất không</b> (tam giác Harberger). Có thể gặp lại ở CĐ3 khi học thặng dư tiêu dùng.</p>
<div class="mh">Trợ giá đại trà hay hỗ trợ trực tiếp?</div><p>Trợ giá xăng đại trà: người đi ô tô (thường thu nhập cao, dùng nhiều xăng) hưởng nhiều nhất; tốn ngân sách lớn; khuyến khích tiêu dùng nhiều. Hỗ trợ trực tiếp nhóm thu nhập thấp: đúng đối tượng hơn, ít méo mó giá, nhưng khó thực thi (xác định đối tượng, chi trả).</p>`}
 ],
 sum:{core:'Giá và lượng do cung – cầu quyết định. Cú sốc cầu làm P, Q cùng chiều; cú sốc cung làm ngược chiều. Can thiệp của Nhà nước chỉ có tác dụng khi ràng buộc, và bên kém co giãn hơn luôn chịu phần lớn thuế, hưởng phần lớn trợ cấp.',
